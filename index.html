<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nafiz Meet</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config={theme:{extend:{colors:{nm:'#0f172a',nm2:'#1e293b',nm3:'#334155',nm4:'#475569',nmt:'#f1f5f9',nmt2:'#94a3b8',nma:'#38bdf8',nmah:'#0ea5e9',nms:'#10b981',nmd:'#ef4444'},fontFamily:{sans:['"Inter"','sans-serif']}}}}
</script>
<style>
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#334155 transparent}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
body{background:#0f172a;color:#f1f5f9;font-family:'Inter',sans-serif;margin:0;overflow-x:hidden}
::selection{background:rgba(56,189,248,0.3)}
input,textarea{font-family:inherit}
a{text-decoration:none;color:inherit}
body.is-recording #mainApp{filter:blur(30px);pointer-events:none;transition:filter 0.3s}
.recording-warning{display:none;position:fixed;inset:0;z-index:999999;background:rgba(15,23,42,0.98);align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#ef4444;font-size:28px;font-weight:700;text-align:center}
body.is-recording .recording-warning{display:flex}
.recording-warning i{font-size:72px}.recording-warning p{color:#f1f5f9;font-size:16px;font-weight:400;max-width:420px}
.toast-box{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:1000000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 24px;border-radius:12px;font-size:14px;font-weight:600;color:#fff;transform:translateY(-30px);opacity:0;transition:all .3s;pointer-events:auto;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.toast.show{transform:translateY(0);opacity:1}
.toast-error{background:#ef4444}.toast-success{background:#10b981}.toast-info{background:#38bdf8;color:#0f172a}
.modal-ov{position:fixed;inset:0;background:rgba(15,23,42,0.8);backdrop-filter:blur(8px);z-index:10000;display:none;align-items:center;justify-content:center}
.modal-ov.show{display:flex}
.modal-box{background:#1e293b;border:1px solid #334155;border-radius:16px;width:600px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 24px 48px rgba(0,0,0,0.5)}
.auth-input{width:100%;padding:14px 16px;background:#0f172a;border:1px solid #334155;border-radius:12px;color:#f1f5f9;font-size:15px;outline:none;transition:border .2s}
.auth-input:focus{border-color:#38bdf8}
.nav-item{display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:12px;transition:all .2s;cursor:pointer;font-size:16px;font-weight:500;color:#94a3b8}
.nav-item:hover{background:rgba(56,189,248,0.1);color:#f1f5f9}
.nav-item.active{background:rgba(56,189,248,0.15);color:#38bdf8;font-weight:700}
.nav-item i{width:24px;text-align:center;font-size:20px}
.post-card{border-bottom:1px solid #334155;padding:16px 20px;transition:background .15s;cursor:pointer}
.post-card:hover{background:rgba(56,189,248,0.05)}
.pa{display:flex;align-items:center;gap:6px;color:#94a3b8;font-size:13px;transition:all .15s;cursor:pointer}
.pa .iw{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pa.lk:hover,.pa.lk:hover .iw{color:#ef4444}.pa.lk:hover .iw{background:rgba(239,68,68,0.15)}.pa.lk.on{color:#ef4444}.pa.lk.on .iw{background:rgba(239,68,68,0.15)}
.pa.rt:hover,.pa.rt:hover .iw{color:#10b981}.pa.rt:hover .iw{background:rgba(16,185,129,0.15)}.pa.rt.on{color:#10b981}.pa.rt.on .iw{background:rgba(16,185,129,0.15)}
.pa.bm:hover,.pa.bm:hover .iw{color:#38bdf8}.pa.bm:hover .iw{background:rgba(56,189,248,0.15)}.pa.bm.on{color:#38bdf8}.pa.bm.on .iw{background:rgba(56,189,248,0.15)}
.chat-item{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;transition:background .15s;border-bottom:1px solid #334155}
.chat-item:hover{background:rgba(56,189,248,0.05)}.chat-item.active{background:rgba(56,189,248,0.1)}
.msg-bubble{max-width:70%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;word-wrap:break-word}
.msg-sent{background:#38bdf8;color:#0f172a;border-bottom-right-radius:4px;margin-left:auto}
.msg-recv{background:#334155;color:#f1f5f9;border-bottom-left-radius:4px}
.call-overlay{position:fixed;inset:0;z-index:50000;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px}
@keyframes sp{to{transform:rotate(360deg)}}.spin{width:20px;height:20px;border:2px solid #334155;border-top-color:#38bdf8;border-radius:50%;animation:sp .6s linear infinite}
@keyframes ringPulse{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(56,189,248,0.7)}70%{transform:scale(1.05);box-shadow:0 0 0 20px rgba(56,189,248,0)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(56,189,248,0)}}.ring-pulse{animation:ringPulse 1.5s infinite}
.copyright-bar{position:fixed;bottom:0;left:0;right:0;background:#0f172a;border-top:1px solid #334155;padding:8px 16px;text-align:center;font-size:11px;color:#64748b;z-index:9000;display:flex;align-items:center;justify-content:center;gap:8px}
.copyright-bar a{color:#38bdf8}
</style>
</head>
<body>
<div class="recording-warning" id="recWarn"><i class="fas fa-shield-halved"></i><span>Recording Blocked</span><p>Screen recording and voice recording are strictly prohibited on Nafiz Meet.</p></div>
<div class="toast-box" id="toastBox"></div>
<div id="mainApp"></div>

<div class="modal-ov" id="cmpModal">
<div class="modal-box" style="padding:24px">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h2 style="font-size:20px;font-weight:700">Create Post</h2><button onclick="closeModal()" style="background:none;border:none;color:#94a3b8;font-size:20px;cursor:pointer"><i class="fas fa-xmark"></i></button></div>
<textarea id="cmpText" style="width:100%;background:#0f172a;border:1px solid #334155;border-radius:12px;padding:14px;color:#f1f5f9;font-size:16px;resize:none;outline:none;min-height:120px" placeholder="What's on your mind?" oninput="updCmpBtn()"></textarea>
<div style="display:flex;justify-content:flex-end;margin-top:16px"><button id="cmpBtn" onclick="doPost()" style="background:#38bdf8;color:#0f172a;border:none;padding:10px 24px;border-radius:9999px;font-weight:700;font-size:15px;cursor:pointer;opacity:.5" disabled>Post</button></div>
</div>
</div>

<div class="modal-ov" id="grpModal">
<div class="modal-box" style="padding:24px">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h2 style="font-size:20px;font-weight:700">Create Group</h2><button onclick="document.getElementById('grpModal').classList.remove('show')" style="background:none;border:none;color:#94a3b8;font-size:20px;cursor:pointer"><i class="fas fa-xmark"></i></button></div>
<input id="grpName" class="auth-input" placeholder="Group Name" style="margin-bottom:16px">
<p style="font-size:14px;color:#94a3b8;margin-bottom:8px">Select Members:</p>
<div id="grpMembersList" style="max-height:200px;overflow-y:auto;margin-bottom:16px"></div>
<button onclick="createGroup()" style="width:100%;padding:12px;border-radius:12px;border:none;font-size:16px;font-weight:700;cursor:pointer;background:#38bdf8;color:#0f172a">Create Group</button>
</div>
</div>

<!-- Call UI with Ringing + Accept/Decline -->
<div class="call-overlay" id="callUI">
<div id="callRinging" style="display:flex;flex-direction:column;align-items:center;gap:24px">
<img id="callAvatar" src="" style="width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #38bdf8" class="ring-pulse" onerror="this.src='https://picsum.photos/seed/call/100/100.jpg'">
<h2 id="callName" style="font-size:28px;font-weight:700">User</h2>
<p id="callStatus" style="color:#94a3b8;font-size:18px">Calling...</p>
<!-- Accept / Decline Buttons -->
<div id="callActions" style="display:flex;gap:48px;margin-top:32px">
<button onclick="acceptCall()" style="width:64px;height:64px;border-radius:50%;background:#10b981;border:none;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(16,185,129,0.5)"><i class="fas fa-phone"></i></button>
<button onclick="declineCall()" style="width:64px;height:64px;border-radius:50%;background:#ef4444;border:none;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(239,68,68,0.5)"><i class="fas fa-phone-slash"></i></button>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://fqpchcdxqzkzkhxtekho.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxcGNoY2R4cXpremtoeHRla2hvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjI2MzIsImV4cCI6MjA5Mzc5ODYzMn0.ykp2L-sfGrYaUdSB4SXyt8OfIXUIQCkiT8cTRw7biJg';
let sb=null;
try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){console.error('Supabase init failed',e)}

let me=null,myProf=null,view='home',viewProf=null,viewPostId=null,replyOverride=null;
let likedSet=new Set(),bmSet=new Set();
let activeConvo=null;

/* ===== RINGTONE (Web Audio API) ===== */
let ringCtx=null,ringOsc=null,ringGain=null,ringInterval=null;
function startRingtone(){
  try{
    ringCtx=new(window.AudioContext||window.webkitAudioContext)();
    function playTone(){
      if(!ringCtx)return;
      ringOsc=ringCtx.createOscillator();ringGain=ringCtx.createGain();
      ringOsc.connect(ringGain);ringGain.connect(ringCtx.destination);
      ringOsc.type='sine';ringOsc.frequency.setValueAtTime(440,ringCtx.currentTime);
      ringOsc.frequency.setValueAtTime(520,ringCtx.currentTime+0.15);
      ringGain.gain.setValueAtTime(0.3,ringCtx.currentTime);
      ringGain.gain.exponentialRampToValueAtTime(0.001,ringCtx.currentTime+0.4);
      ringOsc.start(ringCtx.currentTime);ringOsc.stop(ringCtx.currentTime+0.4);
    }
    playTone();
    ringInterval=setInterval(playTone,1500);
  }catch(e){}
}
function stopRingtone(){
  try{if(ringInterval)clearInterval(ringInterval);if(ringOsc)ringOsc.stop();if(ringCtx)ringCtx.close()}catch(e){}
  ringCtx=null;ringOsc=null;ringGain=null;ringInterval=null;
}

/* ===== SCHEMA CACHE FIX ===== */
async function reloadSchema(){try{await fetch(`${SB_URL}/rest/v1/`,{headers:{apikey:SB_KEY}})}catch(e){}await new Promise(res=>setTimeout(res,5000))}

/* ===== ANTI-RECORDING ===== */
(function(){
  if(navigator.mediaDevices){
    if(navigator.mediaDevices.getDisplayMedia){navigator.mediaDevices.getDisplayMedia=function(){showRecWarn();return Promise.reject(new Error('Blocked'))}}
    if(navigator.mediaDevices.getUserMedia){const og=navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);navigator.mediaDevices.getUserMedia=function(c){if(c&&c.audio){showRecWarn();return Promise.reject(new Error('Blocked'))}return og(c)}}
  }
  document.addEventListener('keydown',function(e){if(e.key==='PrintScreen'){e.preventDefault();showRecWarn()}if((e.ctrlKey||e.metaKey)&&e.shiftKey&&'345'.includes(e.key)){e.preventDefault();showRecWarn()}});
  document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('dragstart',e=>e.preventDefault());
})();
let recTimeout=null;
function showRecWarn(){document.body.classList.add('is-recording');clearTimeout(recTimeout);recTimeout=setTimeout(()=>document.body.classList.remove('is-recording'),5000)}

/* ===== HELPERS ===== */
function toast(msg,type='info'){const c=document.getElementById('toastBox'),t=document.createElement('div');t.className='toast toast-'+type;t.textContent=msg;c.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},4000)}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function linkify(t){return esc(t).replace(/@(\w+)/g,'<span style="color:#38bdf8;cursor:pointer">@$1</span>').replace(/#(\w+)/g,'<span style="color:#38bdf8;cursor:pointer">#$1</span>').replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:#38bdf8">$1</a>').replace(/\n/g,'<br>')}
function fmtTime(d){const dt=new Date(d),now=new Date(),diff=(now-dt)/1000;if(diff<60)return'Just now';if(diff<3600)return Math.floor(diff/60)+'m';if(diff<86400)return Math.floor(diff/3600)+'h';return dt.toLocaleDateString('en',{month:'short',day:'numeric'})}
function v(id){const e=document.getElementById(id);return e?e.value.trim():''}

/* ===== AUTH ===== */
async function doSignUp(){const em=v('sEmail'),pw=v('sPass'),un=v('sUser'),dn=v('sDisp');if(!em||!pw||!un||!dn){toast('All fields required','error');return}if(un.length<3){toast('Username min 3 chars','error');return}if(pw.length<6){toast('Password min 6 chars','error');return}const{data:ex}=await sb.from('profiles').select('username').eq('username',un).maybeSingle();if(ex){toast('Username taken','error');return}const{data,error}=await sb.auth.signUp({email:em,password:pw});if(error){toast(error.message,'error');return}if(data.user){await sb.from('profiles').insert({id:data.user.id,username:un,display_name:dn,bio:'',avatar_url:'',banner_url:''});toast('Account created!','success');me=data.user;await loadMyProf();render()}}
async function doSignIn(){const em=v('lEmail'),pw=v('lPass');if(!em||!pw){toast('Fill all fields','error');return}const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error){toast(error.message,'error');return}me=data.user;await loadMyProf();render();toast('Welcome back!','success')}
async function doSignOut(){await sb.auth.signOut();me=null;myProf=null;render()}
async function loadMyProf(){if(!me)return;const{data}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();myProf=data||{id:me.id,username:'user',display_name:'User',bio:'',avatar_url:'',banner_url:''}}

/* ===== POSTS ===== */
function openModal(){document.getElementById('cmpModal').classList.add('show');document.getElementById('cmpText').value='';replyOverride=null;updCmpBtn()}
function closeModal(){document.getElementById('cmpModal').classList.remove('show');replyOverride=null}
function updCmpBtn(){const b=document.getElementById('cmpBtn'),t=document.getElementById('cmpText');if(!b||!t)return;const ok=t.value.trim().length>0;b.disabled=!ok;b.style.opacity=ok?'1':'.5';b.style.cursor=ok?'pointer':'default'}
async function doPost(){const txt=document.getElementById('cmpText').value.trim();if(!txt)return;const b=document.getElementById('cmpBtn');b.disabled=true;b.innerHTML='<div class="spin" style="margin:auto;border-top-color:#0f172a"></div>';const ins={user_id:me.id,content:txt,like_count:0,repost_count:0,reply_count:0,bookmark_count:0};if(replyOverride)ins.reply_to=replyOverride;const{error}=await sb.from('posts').insert(ins);if(error){toast('Post failed: '+error.message,'error');b.disabled=false;b.textContent='Post';return}closeModal();toast(replyOverride?'Reply sent!':'Post sent!','success');await loadFeed()}

async function getLikedAndBm(){if(!me)return;try{const[l,b]=await Promise.all([sb.from('likes').select('post_id').eq('user_id',me.id),sb.from('bookmarks').select('post_id').eq('user_id',me.id)]);likedSet=new Set((l.data||[]).map(x=>x.post_id));bmSet=new Set((b.data||[]).map(x=>x.post_id))}catch(e){}}

async function loadFeed(){
  const fc=document.getElementById('feedCont');if(!fc)return;
  fc.innerHTML='<div style="padding:40px;display:flex;justify-content:center"><div class="spin" style="width:32px;height:32px"></div></div>';
  await getLikedAndBm();let posts=[];
  try{
    if(view==='home'){const{data:p,error}=await sb.from('posts').select('*, profiles!posts_user_id_fkey(username, display_name, avatar_url)').is('reply_to',null).order('created_at',{ascending:false}).limit(50);if(error)throw error;posts=p||[]}
    else if(view==='explore'){const{data:p,error}=await sb.from('posts').select('*, profiles!posts_user_id_fkey(username, display_name, avatar_url)').is('reply_to',null).order('like_count',{ascending:false}).limit(50);if(error)throw error;posts=p||[]}
    else if(view==='profile'&&viewProf){const{data:p,error}=await sb.from('posts').select('*, profiles!posts_user_id_fkey(username, display_name, avatar_url)').eq('user_id',viewProf).is('reply_to',null).order('created_at',{ascending:false}).limit(50);if(error)throw error;posts=p||[]}
    else if(view==='bookmarks'){const{data:bm}=await sb.from('bookmarks').select('post_id').eq('user_id',me.id);const pids=(bm||[]).map(x=>x.post_id);if(pids.length===0){fc.innerHTML='<div style="padding:60px;text-align:center;color:#64748b"><i class="far fa-bookmark" style="font-size:48px;margin-bottom:16px;display:block"></i><p style="font-size:20px;font-weight:700;color:#f1f5f9">No bookmarks yet</p></div>';return}const{data:p,error}=await sb.from('posts').select('*, profiles!posts_user_id_fkey(username, display_name, avatar_url)').in('id',pids).order('created_at',{ascending:false});if(error)throw error;posts=p||[]}
    if(posts.length===0){fc.innerHTML='<div style="padding:60px;text-align:center;color:#64748b"><i class="fas fa-feather" style="font-size:48px;margin-bottom:16px;display:block"></i><p style="font-size:20px;font-weight:700;color:#f1f5f9">No posts yet</p><p>Be the first to post!</p></div>';return}
    fc.innerHTML=posts.map(p=>postHTML(p)).join('');
  }catch(e){toast("Feed error: "+e.message,"error");if(e.message.includes('schema cache')||e.message.includes('relationship')){toast('Refreshing database cache...','info');await reloadSchema();setTimeout(()=>loadFeed(),2000)}}
}

function postHTML(p,detail=false){
  const liked=likedSet.has(p.id),bmed=bmSet.has(p.id),av=p.profiles?.avatar_url||'https://picsum.photos/seed/'+p.user_id+'/100/100.jpg',tm=fmtTime(p.created_at);
  return `<article class="post-card" data-pid="${p.id}" ${!detail?`onclick="goPost('${p.id}')"`:''}>
<div style="display:flex;gap:12px">
<img src="${av}" style="width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;cursor:pointer;border:2px solid #334155" onclick="event.stopPropagation();goProf('${p.user_id}')" onerror="this.src='https://picsum.photos/seed/${p.user_id}/100/100.jpg'">
<div style="flex:1;min-width:0">
<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span style="font-weight:700;cursor:pointer" onclick="event.stopPropagation();goProf('${p.user_id}')">${esc(p.profiles?.display_name||'User')}</span><span style="color:#64748b;font-size:13px">@${esc(p.profiles?.username||'user')} · ${tm}</span></div>
<p style="font-size:15px;line-height:1.4;margin-top:6px;word-wrap:break-word">${linkify(p.content)}</p>
<div style="display:flex;justify-content:space-between;margin-top:12px;max-width:400px">
<div class="pa" onclick="event.stopPropagation();doReply('${p.id}','${p.profiles?.username||'user'}')"><div class="iw"><i class="far fa-comment" style="font-size:14px"></i></div><span>${p.reply_count||0}</span></div>
<div class="pa rt ${p.repost_count>0?'on':''}" onclick="event.stopPropagation();doRT('${p.id}',this)"><div class="iw"><i class="fas fa-retweet" style="font-size:14px"></i></div><span>${p.repost_count||0}</span></div>
<div class="pa lk ${liked?'on':''}" onclick="event.stopPropagation();doLike('${p.id}',this,${liked})"><div class="iw"><i class="${liked?'fas':'far'} fa-heart" style="font-size:14px"></i></div><span>${p.like_count||0}</span></div>
<div class="pa bm ${bmed?'on':''}" onclick="event.stopPropagation();doBm('${p.id}',this,${bmed})"><div class="iw"><i class="${bmed?'fas':'far'} fa-bookmark" style="font-size:14px"></i></div></div>
</div></div></div></article>`;
}

async function doLike(pid,el,was){if(!me)return;const sp=el.querySelector('span'),ic=el.querySelector('i');let c=parseInt(sp.textContent)||0;if(was){await sb.from('likes').delete().eq('user_id',me.id).eq('post_id',pid);await sb.from('posts').update({like_count:Math.max(0,c-1)}).eq('id',pid);el.classList.remove('on');ic.className='far fa-heart';sp.textContent=Math.max(0,c-1)}else{await sb.from('likes').insert({user_id:me.id,post_id:pid});await sb.from('posts').update({like_count:c+1}).eq('id',pid);el.classList.add('on');ic.className='fas fa-heart';sp.textContent=c+1}}
async function doRT(pid,el){if(!me)return;const sp=el.querySelector('span');let c=parseInt(sp.textContent)||0;if(el.classList.contains('on'))return;await sb.from('posts').update({repost_count:c+1}).eq('id',pid);el.classList.add('on');sp.textContent=c+1;toast('Reposted','success')}
async function doBm(pid,el,was){if(!me)return;const ic=el.querySelector('i');if(was){await sb.from('bookmarks').delete().eq('user_id',me.id).eq('post_id',pid);el.classList.remove('on');ic.className='far fa-bookmark'}else{await sb.from('bookmarks').insert({user_id:me.id,post_id:pid});el.classList.add('on');ic.className='fas fa-bookmark';toast('Bookmarked','success')}}
function doReply(pid,uname){openModal();document.getElementById('cmpText').value='@'+uname+' ';replyOverride=pid;updCmpBtn()}

/* ===== MESSAGING ===== */
async function loadConvos(){
  const cl=document.getElementById('chatList');if(!cl)return;
  cl.innerHTML='<div style="padding:40px;display:flex;justify-content:center"><div class="spin" style="width:32px;height:32px"></div></div>';
  try{
    const{data:membs,error:merr}=await sb.from('conversation_members').select('conversation_id').eq('user_id',me.id);if(merr)throw merr;
    if(!membs||!membs.length){cl.innerHTML='<div style="padding:40px;text-align:center;color:#64748b"><p>No chats yet</p><p style="font-size:13px;margin-top:8px">Start a DM from a profile or create a group!</p></div>';return}
    const cids=membs.map(m=>m.conversation_id);
    const{data:cs,error:cerr}=await sb.from('conversations').select('*').in('id',cids).order('updated_at',{ascending:false});if(cerr)throw cerr;
    let h='';
    for(let c of cs){
      let name=c.name||'Chat',av='';
      if(!c.is_group){const{data:om}=await sb.from('conversation_members').select('user_id').eq('conversation_id',c.id).neq('user_id',me.id).limit(1).maybeSingle();if(om){const{data:op}=await sb.from('profiles').select('*').eq('id',om.user_id).maybeSingle();if(op){name=op.display_name;av=op.avatar_url||`https://picsum.photos/seed/${op.id}/100/100.jpg`}}}
      else{av='https://picsum.photos/seed/group'+c.id+'/100/100.jpg'}
      const{data:lm}=await sb.from('messages').select('content').eq('conversation_id',c.id).order('created_at',{ascending:false}).limit(1).maybeSingle();
      const lastMsg=lm?lm.content.substring(0,30)+(lm.content.length>30?'...':''):'No messages yet';
      h+=`<div class="chat-item ${activeConvo===c.id?'active':''}" onclick="openConvo('${c.id}')"><img src="${av}" style="width:48px;height:48px;border-radius:12px;object-fit:cover;flex-shrink:0" onerror="this.src='https://picsum.photos/seed/chat/100/100.jpg'"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:15px;display:flex;justify-content:space-between"><span>${esc(name)}</span>${c.is_group?'<i class="fas fa-users" style="color:#64748b;font-size:11px"></i>':''}</div><div style="color:#64748b;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(lastMsg)}</div></div></div>`;
    }
    cl.innerHTML=h;
  }catch(e){toast("Messages error: "+e.message,"error");if(e.message.includes('schema cache')||e.message.includes('relation')){toast('Refreshing database cache...','info');await reloadSchema();setTimeout(()=>loadConvos(),2000)}cl.innerHTML='<div style="padding:20px;color:#ef4444;font-size:13px">Error loading chats. Retrying...</div>'}
}

async function openConvo(cid){
  activeConvo=cid;document.getElementById('chatWindow').style.display='flex';document.getElementById('noChat').style.display='none';
  try{
    const{data:convo}=await sb.from('conversations').select('*').eq('id',cid).maybeSingle();
    let name=convo?.name||'Chat',av='';
    if(!convo?.is_group){const{data:om}=await sb.from('conversation_members').select('user_id').eq('conversation_id',cid).neq('user_id',me.id).maybeSingle();if(om){const{data:op}=await sb.from('profiles').select('*').eq('id',om.user_id).maybeSingle();if(op){name=op.display_name;av=op.avatar_url||`https://picsum.photos/seed/${op.id}/100/100.jpg`}}}
    else{av='https://picsum.photos/seed/group'+cid+'/100/100.jpg';name=convo?.name||'Group'}
    document.getElementById('chatHeader').innerHTML=`<div style="display:flex;align-items:center;gap:12px;flex:1"><img src="${av}" style="width:40px;height:40px;border-radius:10px;object-fit:cover" onerror="this.src='https://picsum.photos/seed/chat/100/100.jpg'"><div><div style="font-weight:700;font-size:15px">${esc(name)}</div><div style="color:#64748b;font-size:12px">${convo?.is_group?'Group':'Online'}</div></div></div><div style="display:flex;gap:8px"><button onclick="startCall('${esc(name)}','${av}','voice')" style="background:none;border:none;color:#38bdf8;font-size:16px;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center" onmouseover="this.style.background='rgba(56,189,248,0.15)'" onmouseout="this.style.background='none'"><i class="fas fa-phone"></i></button><button onclick="startCall('${esc(name)}','${av}','video')" style="background:none;border:none;color:#38bdf8;font-size:16px;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center" onmouseover="this.style.background='rgba(56,189,248,0.15)'" onmouseout="this.style.background='none'"><i class="fas fa-video"></i></button></div>`;
    await loadMessages(cid);loadConvos();
  }catch(e){toast("Error opening chat: "+e.message,"error")}
}

async function loadMessages(cid){
  const mc=document.getElementById('msgCont');if(!mc)return;
  mc.innerHTML='<div style="padding:40px;display:flex;justify-content:center"><div class="spin" style="width:32px;height:32px"></div></div>';
  const{data:m,error}=await sb.from('messages').select('*, profiles!messages_sender_id_fkey(username, display_name, avatar_url)').eq('conversation_id',cid).order('created_at',{ascending:true}).limit(100);
  if(error){toast("Msg error: "+error.message,"error");return}
  let h='';let lastSender=null;
  (m||[]).forEach(msg=>{
    const isMine=msg.sender_id===me.id;
    const senderName=msg.profiles?.display_name||msg.profiles?.username||'User';
    const showName=!isMine && msg.sender_id!==lastSender;
    lastSender=msg.sender_id;
    h+=`<div style="display:flex;justify-content:${isMine?'flex-end':'flex-start'};margin-bottom:8px;padding:0 16px">
    <div style="max-width:70%">
    ${showName?`<div style="font-size:12px;font-weight:600;color:#38bdf8;margin-bottom:2px;margin-left:4px">${esc(senderName)}</div>`:''}
    <div class="msg-bubble ${isMine?'msg-sent':'msg-recv'}">${esc(msg.content)}<div style="font-size:10px;opacity:0.7;margin-top:4px;text-align:${isMine?'right':'left'}">${new Date(msg.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div></div></div>`;
  });
  mc.innerHTML=h;mc.scrollTop=mc.scrollHeight;
}

async function sendMsg(){const inp=document.getElementById('msgInput');if(!inp)return;const txt=inp.value.trim();if(!txt||!activeConvo)return;const{error}=await sb.from('messages').insert({conversation_id:activeConvo,sender_id:me.id,content:txt});if(error){toast("Send failed: "+error.message,"error");return}await sb.from('conversations').update({updated_at:new Date().toISOString()}).eq('id',activeConvo);inp.value='';loadMessages(activeConvo);loadConvos()}

async function startDM(userId){
  try{
    const{data:membs}=await sb.from('conversation_members').select('conversation_id').eq('user_id',me.id);
    let existingConvo=null;
    if(membs){for(let m of membs){const{data:other}=await sb.from('conversation_members').select('conversation_id').eq('conversation_id',m.conversation_id).eq('user_id',userId).maybeSingle();if(other){const{data:cd}=await sb.from('conversations').select('is_group').eq('id',other.conversation_id).maybeSingle();if(cd&&!cd.is_group){existingConvo=other.conversation_id;break}}}}
    if(existingConvo){goView('messages');setTimeout(()=>openConvo(existingConvo),300);return}
    const{data:c,error}=await sb.from('conversations').insert({is_group:false}).select().single();if(error)throw error;
    await sb.from('conversation_members').insert([{conversation_id:c.id,user_id:me.id},{conversation_id:c.id,user_id:userId}]);
    goView('messages');setTimeout(()=>openConvo(c.id),300);toast('Chat created!','success');
  }catch(e){toast("DM failed: "+e.message,"error")}
}

async function loadGrpMembers(){const{data:pros}=await sb.from('profiles').select('*').neq('id',me.id);const c=document.getElementById('grpMembersList');if(!c||!pros)return;c.innerHTML=pros.map(p=>`<label style="display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer"><input type="checkbox" value="${p.id}" style="accent-color:#38bdf8;width:18px;height:18px"><img src="${p.avatar_url||'https://picsum.photos/seed/'+p.id+'/100/100.jpg'}" style="width:32px;height:32px;border-radius:8px;object-fit:cover" onerror="this.src='https://picsum.photos/seed/${p.id}/100/100.jpg'"><span>${esc(p.display_name)}</span></label>`).join('')}
async function createGroup(){
  const name=document.getElementById('grpName').value.trim();if(!name){toast('Group name required','error');return}
  const checks=document.querySelectorAll('#grpMembersList input:checked');const uids=Array.from(checks).map(c=>c.value);if(uids.length===0){toast('Select at least 1 member','error');return}
  try{
    const{data:c,error}=await sb.from('conversations').insert({is_group:true,name}).select().single();if(error)throw error;
    const inserts=[{conversation_id:c.id,user_id:me.id}];uids.forEach(uid=>inserts.push({conversation_id:c.id,user_id:uid}));
    const{error:merr}=await sb.from('conversation_members').insert(inserts);if(merr)throw merr;
    document.getElementById('grpModal').classList.remove('show');toast('Group created!','success');goView('messages');setTimeout(()=>openConvo(c.id),300);
  }catch(e){toast("Group failed: "+e.message,"error");if(e.message.includes('schema cache')||e.message.includes('column')){toast('Refreshing database cache...','info');await reloadSchema();toast('Please try creating the group again now.','info')}}
}

/* ===== CALLS WITH RINGING + ACCEPT/DECLINE ===== */
let callTimer=null,callSec=0,callType='voice';

function startCall(name,av,type){
  callType=type||'voice';
  document.getElementById('callUI').style.display='flex';
  document.getElementById('callAvatar').src=av||'https://picsum.photos/seed/call/100/100.jpg';
  document.getElementById('callAvatar').className='ring-pulse';
  document.getElementById('callName').textContent=name;
  document.getElementById('callStatus').innerHTML=`<i class="fas fa-${callType==='video'?'video':'phone'}" style="margin-right:8px"></i>Calling ${esc(name)}...`;
  document.getElementById('callActions').style.display='flex';
  startRingtone();
}

function acceptCall(){
  stopRingtone();
  document.getElementById('callAvatar').className='';
  document.getElementById('callStatus').innerHTML=`<i class="fas fa-${callType==='video'?'video':'phone'}" style="margin-right:8px;color:#10b981"></i><span style="color:#10b981">Connected</span>`;
  document.getElementById('callActions').style.display='none';
  callSec=0;
  callTimer=setInterval(()=>{
    callSec++;
    const m=Math.floor(callSec/60).toString().padStart(2,'0');
    const s=(callSec%60).toString().padStart(2,'0');
    document.getElementById('callStatus').innerHTML=`<i class="fas fa-${callType==='video'?'video':'phone'}" style="margin-right:8px;color:#10b981"></i><span style="color:#10b981">${m}:${s}</span>`;
  },1000);
  toast('Call connected!','success');
}

function declineCall(){
  stopRingtone();
  document.getElementById('callUI').style.display='none';
  clearInterval(callTimer);
  toast('Call declined','info');
}

function endCall(){
  stopRingtone();
  document.getElementById('callUI').style.display='none';
  clearInterval(callTimer);
  if(callSec>0)toast(`Call ended - ${Math.floor(callSec/60)}m ${callSec%60}s`,'info');
  else toast('Call ended','info');
  callSec=0;
}

}

function renderCalls(){const fc=document.getElementById('feedCont');if(!fc)return;fc.innerHTML=`<div style="padding:80px 20px;text-align:center;color:#64748b"><i class="fas fa-phone" style="font-size:48px;margin-bottom:16px;display:block;color:#334155"></i><p style="font-size:20px;font-weight:700;color:#f1f5f9">Nafiz Meet Calls</p><p style="margin-bottom:24px;font-size:14px">Start a call from any chat conversation.</p><button onclick="goView('messages')" style="padding:12px 24px;border-radius:12px;background:#38bdf8;color:#0f172a;border:none;font-weight:700;cursor:pointer;font-size:15px">Go to Messages</button></div>`}

async function renderProfileHeader(){
  const c=document.getElementById('profileHeader');if(!c||!viewProf)return;
  const{data:prof}=await sb.from('profiles').select('*').eq('id',viewProf).maybeSingle();
  if(!prof){c.innerHTML='<p style="padding:40px;text-align:center;color:#64748b">Profile not found</p>';return}
  const{count:fc}=await sb.from('follows').select('*',{count:'exact',head:true}).eq('following_id',viewProf);
  const{count:fwc}=await sb.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',viewProf);
  const{data:isF}=await sb.from('follows').select('*').eq('follower_id',me.id).eq('following_id',viewProf).maybeSingle();
  const av=prof.avatar_url||'https://picsum.photos/seed/'+prof.id+'/100/100.jpg',own=viewProf===me.id;
  c.innerHTML=`<div style="height:160px;background:linear-gradient(135deg,#1e293b 0%,#334155 100%);position:relative"><div style="position:absolute;bottom:-40px;left:20px"><img src="${av}" style="width:100px;height:100px;border-radius:20px;border:4px solid #0f172a;object-fit:cover" onerror="this.src='https://picsum.photos/seed/${prof.id}/100/100.jpg'"></div></div><div style="padding:50px 20px 16px;display:flex;justify-content:space-between;align-items:flex-start"><div><h2 style="font-size:22px;font-weight:800">${esc(prof.display_name)}</h2><span style="color:#64748b">@${esc(prof.username)}</span></div><div style="display:flex;gap:8px">${own?`<button onclick="toast('Edit profile coming soon','info')" style="padding:8px 20px;border-radius:10px;border:1px solid #334155;background:transparent;color:#f1f5f9;font-weight:600;cursor:pointer">Edit profile</button>`:`<button style="padding:8px 16px;border-radius:10px;border:1px solid #334155;background:transparent;color:#f1f5f9;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px" onclick="startDM('${prof.id}')"><i class="fas fa-comment-dots"></i> Message</button>`}</div></div>${prof.bio?`<p style="padding:0 20px 16px;font-size:14px">${esc(prof.bio)}</p>`:''}<div style="display:flex;gap:20px;padding:0 20px 16px;font-size:14px"><span><strong>${fwc||0}</strong> <span style="color:#64748b">Following</span></span><span><strong>${fc||0}</strong> <span style="color:#64748b">Followers</span></span></div>`;
}

function updInline(){const b=document.getElementById('inlineBtn'),t=document.getElementById('inlineCmp');if(!b||!t)return;const ok=t.value.trim().length>0;b.disabled=!ok;b.style.opacity=ok?'1':'.5';b.style.cursor=ok?'pointer':'default'}
async function doInlinePost(){const t=document.getElementById('inlineCmp');if(!t)return;const c=t.value.trim();if(!c)return;const b=document.getElementById('inlineBtn');b.disabled=true;b.innerHTML='<div class="spin" style="margin:auto;border-top-color:#0f172a"></div>';const{error}=await sb.from('posts').insert({user_id:me.id,content:c,like_count:0,repost_count:0,reply_count:0,bookmark_count:0});if(error){toast("Post failed: "+error.message,"error");b.disabled=false;b.textContent='Post';return}t.value='';updInline();toast('Post sent!','success');await loadFeed()}

async function loadWTF(){const c=document.getElementById('wtfBox');if(!c)return;try{const{data:fw}=await sb.from('follows').select('following_id').eq('follower_id',me.id);const ids=fw?fw.map(f=>f.following_id):[];ids.push(me.id);const{data:pros}=await sb.from('profiles').select('*').not('id','in',`(${ids.join(',')})`).limit(3);let h='<h3 style="font-size:16px;font-weight:700;padding:14px 16px">Suggested Users</h3>';if(!pros||!pros.length){h+='<p style="padding:14px 16px;color:#64748b;font-size:13px">No suggestions</p>';c.innerHTML=h;return}pros.forEach(p=>{const av=p.avatar_url||'https://picsum.photos/seed/'+p.id+'/100/100.jpg';h+=`<div style="display:flex;align-items:center;padding:10px 16px;gap:10px;cursor:pointer" onclick="goProf('${p.id}')"><img src="${av}" style="width:36px;height:36px;border-radius:10px;object-fit:cover" onerror="this.src='https://picsum.photos/seed/${p.id}/100/100.jpg'"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">${esc(p.display_name)}</div><div style="color:#64748b;font-size:12px">@${esc(p.username)}</div></div><button style="padding:6px 14px;border-radius:8px;background:#38bdf8;color:#0f172a;border:none;font-weight:600;font-size:12px;cursor:pointer" onclick="event.stopPropagation();doFollow('${p.id}',this)">Follow</button></div>`});c.innerHTML=h}catch(e){}}

async function doFollow(uid,btn){if(!me||uid===me.id)return;const{data:existing}=await sb.from('follows').select('*').eq('follower_id',me.id).eq('following_id',uid).maybeSingle();if(existing){await sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',uid);btn.style.background='#38bdf8';btn.style.color='#0f172a';btn.textContent='Follow'}else{await sb.from('follows').insert({follower_id:me.id,following_id:uid});btn.style.background='transparent';btn.style.color='#38bdf8';btn.style.border='1px solid #38bdf8';btn.textContent='Following'}loadWTF()}

function setupRealtime(){if(!sb)return;sb.channel('nm-rt').on('postgres_changes',{event:'INSERT',schema:'public',table:'posts'},p=>{if(view==='home'&&p.new&&p.new.user_id!==me.id){const fc=document.getElementById('feedCont');if(fc&&!fc.querySelector('.new-bar')){const bar=document.createElement('div');bar.className='new-bar';bar.style.cssText='background:rgba(56,189,248,0.1);color:#38bdf8;text-align:center;padding:10px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:1px solid #334155';bar.textContent='See new posts';bar.onclick=()=>{bar.remove();loadFeed()};fc.prepend(bar)}}}).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{if(p.new&&p.new.conversation_id===activeConvo){loadMessages(activeConvo)}}).subscribe()}

async function init(){if(!sb){document.getElementById('mainApp').innerHTML='<div style="padding:40px;text-align:center;color:#ef4444">Fatal Error: Supabase failed to load.</div>';return}try{const{data:{session}}=await sb.auth.getSession();if(session){me=session.user;await loadMyProf();setupRealtime()}}catch(e){console.error('Init error',e)}render();try{sb.auth.onAuthStateChange(async(e,s)=>{if(e==='SIGNED_IN'&&s){me=s.user;await loadMyProf();setupRealtime();render()}else if(e==='SIGNED_OUT'){me=null;myProf=null;render()}})}catch(e){}document.addEventListener('click',e=>{document.querySelectorAll('.dd-menu').forEach(m=>{if(!m.parentElement.contains(e.target))m.style.display='none'})});document.getElementById('cmpModal').addEventListener('click',function(e){if(e.target===this)closeModal()});document.getElementById('grpModal').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')})}
init();
</script>
</body>
</html>
