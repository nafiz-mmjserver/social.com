<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

tailwind.config={theme:{extend:{colors:{xbg:'#000',xbg2:'#16181c',xbg3:'#1d1f23',xborder:'#2f3336',xtext:'#e7e9ea',xtext2:'#71767b',xblue:'#1d9bf0',xred:'#f4212e',xgreen:'#00ba7c'},fontFamily:{sans:['"Noto Sans"','sans-serif']}}}}

<style>
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#2f3336 transparent}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#2f3336;border-radius:4px}
body{background:#000;color:#e7e9ea;font-family:'Noto Sans',sans-serif;margin:0;overflow-x:hidden}
::selection{background:rgba(29,155,240,0.4)}
input,textarea{font-family:inherit}
a{text-decoration:none;color:inherit}

/* Anti-recording */
body.is-recording #mainApp{filter:blur(30px);pointer-events:none;transition:filter 0.3s}
.recording-warning{display:none;position:fixed;inset:0;z-index:999999;background:rgba(0,0,0,0.97);align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#f4212e;font-size:28px;font-weight:700;text-align:center}
body.is-recording .recording-warning{display:flex}
.recording-warning i{font-size:72px}
.recording-warning p{color:#e7e9ea;font-size:16px;font-weight:400;max-width:420px}

/* Toast */
.toast-box{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:1000000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;color:#fff;transform:translateY(-30px);opacity:0;transition:all .3s;pointer-events:auto;white-space:nowrap}
.toast.show{transform:translateY(0);opacity:1}
.toast-error{background:#f4212e}.toast-success{background:#00ba7c}.toast-info{background:#1d9bf0}

/* Sidebar */
.sb-item{display:flex;align-items:center;gap:20px;padding:12px 16px;border-radius:9999px;transition:background .2s;cursor:pointer;font-size:20px;user-select:none}
.sb-item:hover{background:rgba(231,233,234,0.08)}
.sb-item.act{font-weight:700}
.sb-item i{width:26px;text-align:center;font-size:24px}

/* Post */
.post-card{border-bottom:1px solid #2f3336;padding:12px 16px;transition:background .15s;cursor:pointer}
.post-card:hover{background:rgba(231,233,234,0.03)}
.pa{display:flex;align-items:center;gap:4px;color:#71767b;font-size:13px;transition:all .15s;cursor:pointer}
.pa .iw{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pa.reply:hover,.pa.reply:hover .iw{color:#1d9bf0}.pa.reply:hover .iw{background:rgba(29,155,240,0.15)}
.pa.rt:hover,.pa.rt:hover .iw{color:#00ba7c}.pa.rt:hover .iw{background:rgba(0,186,124,0.15)}
.pa.rt.on{color:#00ba7c}.pa.rt.on .iw{background:rgba(0,186,124,0.15)}
.pa.lk:hover,.pa.lk:hover .iw{color:#f4212e}.pa.lk:hover .iw{background:rgba(244,33,46,0.15)}
.pa.lk.on{color:#f4212e}.pa.lk.on .iw{background:rgba(244,33,46,0.15)}
.pa.vw:hover,.pa.vw:hover .iw{color:#1d9bf0}.pa.vw:hover .iw{background:rgba(29,155,240,0.15)}
.pa.bm:hover,.pa.bm:hover .iw{color:#1d9bf0}.pa.bm:hover .iw{background:rgba(29,155,240,0.15)}
.pa.bm.on{color:#1d9bf0}.pa.bm.on .iw{background:rgba(29,155,240,0.15)}
.pa.sh:hover,.pa.sh:hover .iw{color:#1d9bf0}.pa.sh:hover .iw{background:rgba(29,155,240,0.15)}

/* Compose */
.cmp-input{background:0 0;border:none;outline:none;color:#e7e9ea;font-size:20px;width:100%;resize:none;min-height:52px}
.cmp-input::placeholder{color:#71767b}

/* Modal */
.modal-ov{position:fixed;inset:0;background:rgba(91,112,131,0.4);z-index:10000;display:none;align-items:center;justify-content:center}
.modal-ov.show{display:flex}
.modal-box{background:#000;border:1px solid #2f3336;border-radius:16px;width:600px;max-width:95vw;max-height:90vh;overflow-y:auto}

/* Auth */
.auth-input{width:100%;padding:16px 12px;background:0 0;border:1px solid #333;border-radius:4px;color:#e7e9ea;font-size:17px;outline:none;transition:border .2s}
.auth-input:focus{border-color:#1d9bf0}

/* Tab */
.tab-i{flex:1;text-align:center;padding:16px 0;color:#71767b;font-weight:500;cursor:pointer;position:relative;transition:all .2s}
.tab-i:hover{background:rgba(231,233,234,0.08)}
.tab-i.act{color:#e7e9ea;font-weight:700}
.tab-i.act::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:56px;height:4px;background:#1d9bf0;border-radius:2px}

/* Trend */
.tr-item{padding:12px 16px;transition:background .15s;cursor:pointer}
.tr-item:hover{background:rgba(231,233,234,0.03)}

/* Follow btn */
.fl-btn{padding:8px 20px;border-radius:9999px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;border:none}
.fl-btn.nf{background:#e7e9ea;color:#0f1419}.fl-btn.nf:hover{background:#d6d9db}
.fl-btn.fg{background:0 0;color:#e7e9ea;border:1px solid #536471}.fl-btn.fg:hover{border-color:#f4212e;color:#f4212e;background:rgba(244,33,46,0.1)}

/* Dropdown */
.dd-menu{position:absolute;right:0;top:100%;background:#16181c;border:1px solid #2f3336;border-radius:12px;overflow:hidden;min-width:200px;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,0.5);display:none}
.dd-item{padding:12px 16px;cursor:pointer;transition:background .15s;font-size:15px;display:flex;align-items:center;gap:12px}
.dd-item:hover{background:rgba(231,233,234,0.08)}

/* Spinner */
.spin{width:20px;height:20px;border:2px solid #2f3336;border-top-color:#1d9bf0;border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@keyframes heartPop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.hpop{animation:heartPop .3s ease}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fup{animation:fadeUp .3s ease forwards}

/* Copyright */
.copyright-bar{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #2f3336;padding:8px 16px;text-align:center;font-size:12px;color:#71767b;z-index:9000;display:flex;align-items:center;justify-content:center;gap:8px}
.copyright-bar a{color:#1d9bf0;transition:color .2s}.copyright-bar a:hover{color:#1a8cd8}

@media(max-width:1000px){.r-sb{display:none!important}}
@media(max-width:700px){.l-sb{display:none!important}.mob-nav{display:flex!important}}
</style>
</head>

<i class="fas fa-shield-halved"></i>
<span>Recording Detected</span>

<!-- Compose Modal -->

<img id="cmpAvatar" src="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0">
<div style="flex:1">
<textarea id="cmpText" class="cmp-input" placeholder="What is happening?!" rows="4" oninput="updCmpBtn()"></textarea>
<div style="border-top:1px solid #2f3336;padding-top:12px;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;gap:2px">
<button style="color:#1d9bf0;background:none;border:none;cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center" onmouseover="this.style.background='rgba(29,155,240,0.15)'" onmouseout="this.style.background='none'"><i class="fas fa-image"></i></button>
<button style="color:#1d9bf0;background:none;border:none;cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center" onmouseover="this.style.background='rgba(29,155,240,0.15)'" onmouseout="this.style.background='none'"><i class="fas fa-face-smile"></i></button>
<button style="color:#1d9bf0;background:none;border:none;cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center" onmouseover="this.style.background='rgba(29,155,240,0.15)'" onmouseout="this.style.background='none'"><i class="fas fa-square-poll-vertical"></i></button>
</div>
<button id="cmpBtn" onclick="doPost()" style="background:#1d9bf0;color:#fff;border:none;padding:8px 24px;border-radius:9999px;font-weight:700;font-size:15px;cursor:pointer;opacity:.5" disabled>Post</button>
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ========== SUPABASE ========== */
const SB_URL='https://fqpchcdxqzkzkhxtekho.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxcGNoY2R4cXpremtoeHRla2hvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjI2MzIsImV4cCI6MjA5Mzc5ODYzMn0.ykp2L-sfGrYaUdSB4SXyt8OfIXUIQCkiT8cTRw7biJg';
let sb=null;
try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){console.error('Supabase init failed',e)}

/* ========== STATE ========== */
let me=null,myProf=null,view='home',viewProf=null,viewPostId=null,replyOverride=null;
let likedSet=new Set(),bmSet=new Set();

/* ========== ANTI-RECORDING ========== */
(function(){
  // Block screen capture
  if(navigator.mediaDevices){
    if(navigator.mediaDevices.getDisplayMedia){
      const og=navigator.mediaDevices.getDisplayMedia.bind(navigator.mediaDevices);
      navigator.mediaDevices.getDisplayMedia=function(){showRecWarn();return Promise.reject(new Error('Blocked'))};
    }
    // Block audio recording
    if(navigator.mediaDevices.getUserMedia){
      const og2=navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
      navigator.mediaDevices.getUserMedia=function(c){
        if(c&&c.audio){showRecWarn();return Promise.reject(new Error('Audio recording blocked'))}
        return og2(c);
      };
    }
  }
  // Keyboard shortcuts
  document.addEventListener('keydown',function(e){
    if(e.key==='PrintScreen'){e.preventDefault();showRecWarn()}
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&'345'.includes(e.key)){e.preventDefault();showRecWarn()}
  });
  // Block context menu, copy, drag
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('copy',e=>e.preventDefault());
  document.addEventListener('dragstart',e=>e.preventDefault());
  // Periodic screen capture check
  setInterval(async()=>{
    try{const s=await navigator.mediaDevices.getDisplayMedia({video:true});s.getTracks().forEach(t=>t.stop());showRecWarn()}catch(e){}
  },5000);
})();

let recTimeout=null;
function showRecWarn(){
  document.body.classList.add('is-recording');
  clearTimeout(recTimeout);
  recTimeout=setTimeout(()=>document.body.classList.remove('is-recording'),5000);
}

/* ========== TOAST ========== */
function toast(msg,type='info'){
  const c=document.getElementById('toastBox');
  const t=document.createElement('div');
  t.className='toast toast-'+type;t.textContent=msg;c.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},3000);
}

/* ========== AUTH ========== */
async function doSignUp(){
  const em=v('sEmail'),pw=v('sPass'),un=v('sUser'),dn=v('sDisp');
  if(!em||!pw||!un||!dn){toast('All fields required','error');return}
  if(un.length<3){toast('Username min 3 chars','error');return}
  if(pw.length<6){toast('Password min 6 chars','error');return}
  // Check username
  const{data:ex}=await sb.from('profiles').select('username').eq('username',un).maybeSingle();
  if(ex){toast('Username taken','error');return}
  const{data,error}=await sb.auth.signUp({email:em,password:pw});
  if(error){toast(error.message,'error');return}
  if(data.user){
    await sb.from('profiles').insert({id:data.user.id,username:un,display_name:dn,bio:'',avatar_url:'',banner_url:''});
    toast('Account created! Check email to verify.','success');
    me=data.user;await loadMyProf();render();
  }
}
async function doSignIn(){
  const em=v('lEmail'),pw=v('lPass');
  if(!em||!pw){toast('Fill all fields','error');return}
  const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
  if(error){toast(error.message,'error');return}
  me=data.user;await loadMyProf();render();
  toast('Welcome back!','success');
}
async function doSignOut(){
  await sb.auth.signOut();me=null;myProf=null;render();
}
async function loadMyProf(){
  if(!me)return;
  const{data}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();
  myProf=data||{id:me.id,username:'user',display_name:'User',bio:'',avatar_url:'',banner_url:''};
}
function v(id){const e=document.getElementById(id);return e?e.value.trim():''}

/* ========== COMPOSE ========== */
function openModal(){
  document.getElementById('cmpModal').classList.add('show');
  const av=document.getElementById('cmpAvatar');
  av.src=myProf?.avatar_url||'https://picsum.photos/seed/'+(myProf?.id||'x')+'/100/100.jpg';
  document.getElementById('cmpText').value='';
  replyOverride=null;
  updCmpBtn();
  setTimeout(()=>document.getElementById('cmpText').focus(),100);
}
function closeModal(){document.getElementById('cmpModal').classList.remove('show');replyOverride=null}
function updCmpBtn(){
  const b=document.getElementById('cmpBtn'),t=document.getElementById('cmpText');
  if(!b||!t)return;
  const ok=t.value.trim().length>0;b.disabled=!ok;b.style.opacity=ok?'1':'.5';b.style.cursor=ok?'pointer':'default';
}
async function doPost(){
  const txt=document.getElementById('cmpText').value.trim();if(!txt)return;
  const b=document.getElementById('cmpBtn');b.disabled=true;b.innerHTML='<div class="spin" style="margin:auto;border-top-color:#fff"></div>';
  const insertData={user_id:me.id,content:txt,like_count:0,repost_count:0,reply_count:0,bookmark_count:0};
  if(replyOverride)insertData.reply_to=replyOverride;
  const{error}=await sb.from('posts').insert(insertData);
  if(error){toast(error.message,'error');b.disabled=false;b.textContent='Post';return}
  closeModal();toast(replyOverride?'Reply sent!':'Post sent!','success');
  if(replyOverride&&viewPostId){await loadThread(viewPostId)}else{await loadFeed()}
}

/* ========== FEED LOADING ========== */
async function getLikedAndBm(){
  if(!me)return;
  const[l,b]=await Promise.all([
    sb.from('likes').select('post_id').eq('user_id',me.id),
    sb.from('bookmarks').select('post_id').eq('user_id',me.id)
  ]);
  likedSet=new Set((l.data||[]).map(x=>x.post_id));
  bmSet=new Set((b.data||[]).map(x=>x.post_id));
}

async function loadFeed(){
  const fc=document.getElementById('feedCont');if(!fc)return;
  fc.innerHTML='<div style="padding:40px;display:flex;justify-content:center"><div class="spin" style="width:32px;height:32px"></div></div>';
  await getLikedAndBm();
  let posts=[];
  if(view==='home'){
    const{data:fw}=await sb.from('follows').select('following_id').eq('follower_id',me.id);
    const ids=fw?fw.map(f=>f.following_id):[];ids.push(me.id);
    const{data:p}=await sb.from('posts').select('*,profiles(username,display_name,avatar_url)').in('user_id',ids).is('reply_to',null).order('created_at',{ascending:false}).limit(50);
    posts=p||[];
  }else if(view==='explore'){
    const{data:p}=await sb.from('posts').select('*,profiles(username,display_name,avatar_url)').is('reply_to',null).order('like_count',{ascending:false}).limit(50);
    posts=p||[];
  }else if(view==='profile'&&viewProf){
    const{data:p}=await sb.from('posts').select('*,profiles(username,display_name,avatar_url)').eq('user_id',viewProf).is('reply_to',null).order('created_at',{ascending:false}).limit(50);
    posts=p||[];
  }else if(view==='bookmarks'){
    const{data:bm}=await sb.from('bookmarks').select('post_id').eq('user_id',me.id);
    const pids=(bm||[]).map(x=>x.post_id);
    if(pids.length===0){fc.innerHTML=emptyState('far fa-bookmark','No bookmarks yet','Save posts to read later.');return}
    const{data:p}=await sb.from('posts').select('*,profiles(username,display_name,avatar_url)').in('id',pids).order('created_at',{ascending:false});
    posts=p||[];
  }
  if(posts.length===0){fc.innerHTML=emptyState('fas fa-feather','No posts yet','When people post, you\'ll see them here.');return}
  fc.innerHTML=posts.map(p=>postHTML(p)).join('');
}

async function loadThread(pid){
  const fc=document.getElementById('feedCont');if(!fc)return;
  fc.innerHTML='<div style="padding:40px;display:flex;justify-content:center"><div class="spin" style="width:32px;height:32px"></div></div>';
  await getLikedAndBm();
  const{data:post}=await sb.from('posts').select('*,profiles(username,display_name,avatar_url)').eq('id',pid).maybeSingle();
  const{data:reps}=await sb.from('posts').select('*,profiles(username,display_name,avatar_url)').eq('reply_to',pid).order('created_at',{ascending:true});
  let h='';if(post)h+=postHTML(post,true);
  if(reps&&reps.length)reps.forEach(r=>h+=postHTML(r,false,true));
  fc.innerHTML=h||emptyState('fas fa-feather','Post not found','');
}

function emptyState(icon,title,sub){
  return `<div style="padding:60px 20px;text-align:center;color:#71767b"><i class="${icon}" style="font-size:48px;margin-bottom:16px;display:block"></i><p style="font-size:20px;font-weight:700;color:#e7e9ea">${title}</p><p>${sub}</p></div>`;
}

/* ========== POST HTML ========== */
function postHTML(p,detail=false,isReply=false){
  const liked=likedSet.has(p.id),bmed=bmSet.has(p.id);
  const av=p.profiles?.avatar_url||'https://picsum.photos/seed/'+p.user_id+'/100/100.jpg';
  const tm=fmtTime(p.created_at);
  return `<article class="post-card fup" data-pid="${p.id}" ${!detail?`onclick="goPost('${p.id}')"`:''}>
<div style="display:flex;gap:12px">
<div style="width:40px;flex-shrink:0">${isReply?'<div style="width:2px;height:100%;background:#2f3336;border-radius:1px;min-height:24px;margin:0 auto"></div>':''}</div>
<div style="margin-left:-40px;display:flex;gap:12px;flex:1;min-width:0">
<img src="${av}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;cursor:pointer" onclick="event.stopPropagation();goProf('${p.user_id}')" onerror="this.src='https://picsum.photos/seed/${p.user_id}/100/100.jpg'">
<div style="flex:1;min-width:0">
<div style="display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden">
<span style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer" onclick="event.stopPropagation();goProf('${p.user_id}')">${esc(p.profiles?.display_name||'User')}</span>
<span style="color:#71767b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">@${esc(p.profiles?.username||'user')}</span>
<span style="color:#71767b">·</span><span style="color:#71767b;white-space:nowrap">${tm}</span>
</div>
 ${detail&&p.user_id===me?.id?`<div style="position:relative"><button onclick="event.stopPropagation();this.nextElementSibling.style.display=this.nextElementSibling.style.display==='block'?'none':'block'" style="background:none;border:none;color:#71767b;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center" onmouseover="this.style.background='rgba(231,233,234,0.08)'" onmouseout="this.style.background='none'"><i class="fas fa-ellipsis"></i></button><div class="dd-menu"><div class="dd-item" onclick="event.stopPropagation();delPost('${p.id}')"><i class="fas fa-trash" style="color:#f4212e"></i><span style="color:#f4212e">Delete</span></div></div></div>`:''}
</div>
<p style="font-size:${detail?'17px':'15px'};line-height:1.35;margin-top:2px;word-wrap:break-word">${linkify(p.content)}</p>
 ${p.image_url?`<img src="${p.image_url}" style="width:100%;border-radius:16px;margin-top:12px;border:1px solid #2f3336;max-height:500px;object-fit:cover" onerror="this.style.display='none'">`:''}
<div style="display:flex;justify-content:space-between;margin-top:12px;max-width:425px;${detail?'':'opacity:.7'}">
<div class="pa reply" onclick="event.stopPropagation();doReply('${p.id}','${p.profiles?.username||'user'}')"><div class="iw"><i class="far fa-comment" style="font-size:16px"></i></div><span>${p.reply_count||0}</span></div>
<div class="pa rt" onclick="event.stopPropagation();doRT('${p.id}',this)"><div class="iw"><i class="fas fa-retweet" style="font-size:16px"></i></div><span>${p.repost_count||0}</span></div>

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function linkify(t){return esc(t).replace(/@(\w+)/g,'<span style="color:#1d9bf0;cursor:pointer">@$1</span>').replace(/#(\w+)/g,'<span style="color:#1d9bf0;cursor:pointer">#$1</span>').replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:#1d9bf0">$1</a>').replace(/\n/g,'<br>')}
function fmtTime(d){
  const dt=new Date(d),now=new Date(),diff=(now-dt)/1000;
  if(diff<60)return'now';if(diff<3600)return Math.floor(diff/60)+'m';
  if(diff<86400)return Math.floor(diff/3600)+'h';
  if(diff<31536000)return dt.toLocaleDateString('en',{month:'short',day:'numeric'});
  return dt.toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'});
}

/* ========== INTERACTIONS ========== */
async function doLike(pid,el,was){
  if(!me)return;
  const sp=el.querySelector('span'),ic=el.querySelector('i');
  let c=parseInt(sp.textContent)||0;
  if(was){
    await sb.from('likes').delete().eq('user_id',me.id).eq('post_id',pid);
    await sb.from('posts').update({like_count:Math.max(0,c-1)}).eq('id',pid);
    el.classList.remove('on');ic.className='far fa-heart';sp.textContent=Math.max(0,c-1);
  }else{
    await sb.from('likes').insert({user_id:me.id,post_id:pid});
    await sb.from('posts').update({like_count:c+1}).eq('id',pid);
    el.classList.add('on');ic.className='fas fa-heart hpop';sp.textContent=c+1;
  }
}
async function doRT(pid,el){
  if(!me)return;
  const sp=el.querySelector('span');let c=parseInt(sp.textContent)||0;
  if(el.classList.contains('on'))return;
  await sb.from('posts').update({repost_count:c+1}).eq('id',pid);
  el.classList.add('on');sp.textContent=c+1;toast('Reposted','success');
}
async function doBm(pid,el,was){
  if(!me)return;
  const ic=el.querySelector('i');
  if(was){
    await sb.from('bookmarks').delete().eq('user_id',me.id).eq('post_id',pid);
    el.classList.remove('on');ic.className='far fa-bookmark';
  }else{
    await sb.from('bookmarks').insert({user_id:me.id,post_id:pid});
    el.classList.add('on');ic.className='fas fa-bookmark';toast('Bookmarked','success');
  }
}
function doShare(pid){
  const u=location.origin+'/post/'+pid;
  if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>toast('Link copied','success'));
  else toast(u,'info');
}
async function delPost(pid){
  await sb.from('likes').delete().eq('post_id',pid);
  await sb.from('bookmarks').delete().eq('post_id',pid);
  await sb.from('posts').delete().eq('id',pid);
  toast('Post deleted','info');
  if(view==='home'||view==='explore')await loadFeed();
  else if(viewPostId)await loadThread(viewPostId);
  else render();
}
function doReply(pid,uname){
  openModal();
  document.getElementById('cmpText').value='@'+uname+' ';
  replyOverride=pid;updCmpBtn();
}

/* ========== FOLLOW ========== */
async function doFollow(uid,btn){
  if(!me||uid===me.id)return;
  const{data:existing}=await sb.from('follows').select('*').eq('follower_id',me.id).eq('following_id',uid).maybeSingle();
  if(existing){
    await sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',uid);
    btn.className='fl-btn nf';btn.textContent='Follow';
  }else{
    await sb.from('follows').insert({follower_id:me.id,following_id:uid});
    btn.className='fl-btn fg';btn.textContent='Following';
  }
  loadWTF();
}

    h=`<header style="position:sticky;top:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(12px);z-index:100;border-bottom:1px solid #2f3336">
<div style="display:flex;align-items:center;padding:0 16px">
<button onclick="goView('home')" style="background:none;border:none;color:#e7e9ea;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center" onmouseover="this.style.background='rgba(231,233,234,0.08)'" onmouseout="this.style.background='none'"><i class="fas fa-arrow-left" style="font-size:18px"></i></button>
<h2 style="font-size:20px;font-weight:700;padding:12px 0;margin-left:16px">Post</h2>
</div></header>`;
  }else{
    h=`<header style="position:sticky;top:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(12px);z-index:100;border-bottom:1px solid #2f3336">
<div style="padding:12px 16px;display:flex;align-items:center;gap:16px">
<button onclick="goView('home')" style="background:none;border:none;color:#e7e9ea;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center" onmouseover="this.style.background='rgba(231,233,234,0.08)'" onmouseout="this.style.background='none'"><i class="fas fa-arrow-left" style="font-size:18px"></i></button>
<h2 style="font-size:20px;font-weight:700">Nafiz Meet</h2>
</div></header>`;
  }
  hdr.innerHTML=h;
}

async function renderProfileHeader(){
  const c=document.getElementById('profileHeader');if(!c||!viewProf)return;
  const{data:prof}=await sb.from('profiles').select('*').eq('id',viewProf).maybeSingle();
  if(!prof){c.innerHTML='<p style="padding:40px;text-align:center;color:#71767b">Profile not found</p>';return}
  const{count:pc}=await sb.from('posts').select('*',{count:'exact',head:true}).eq('user_id',viewProf).is('reply_to',null);
  const{count:fc}=await sb.from('follows').select('*',{count:'exact',head:true}).eq('following_id',viewProf);
  const{count:fwc}=await sb.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',viewProf);
  const{data:isF}=await sb.from('follows').select('*').eq('follower_id',me.id).eq('following_id',viewProf).maybeSingle();
  const av=prof.avatar_url||'https://picsum.photos/seed/'+prof.id+'/100/100.jpg';
  const ban=prof.banner_url||'';
  const own=viewProf===me.id;
  c.innerHTML=`
<div class="profile-banner" style="height:200px;${ban?`background:url(${ban});background-size:cover;background-position:center`:'background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)'}"></div>
<div style="padding:0 16px">
<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-top:-34px">
<img src="${av}" style="width:134px;height:134px;border-radius:50%;border:4px solid #000;object-fit:cover" onerror="this.src='https://picsum.photos/seed/${prof.id}/100/100.jpg'">
<div style="padding-top:12px">
 ${own?`<button onclick="toast('Edit profile coming soon','info')" style="padding:8px 20px;border-radius:9999px;border:1px solid #536471;background:transparent;color:#e7e9ea;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s" onmouseover="this.style.background='rgba(231,233,234,0.08)'" onmouseout="this.style.background='transparent'">Edit profile</button>`:(isF?`<button class="fl-btn fg" onclick="doFollow('${prof.id}',this)">Following</button>`:`<button class="fl-btn nf" onclick="doFollow('${prof.id}',this)">Follow</button>`)}
</div>
</div>
<div style="margin-top:12px"><h2 style="font-size:20px;font-weight:800">${esc(prof.display_name)}</h2><span style="color:#71767b;font-size:15px">@${esc(prof.username)}</span></div>
 ${prof.bio?`<p style="margin-top:12px;font-size:15px;line-height:1.4">${esc(prof.bio)}</p>`:''}
<div style="display:flex;gap:16px;margin-top:12px;color:#71767b;font-size:14px"><span><i class="far fa-calendar" style="margin-right:4px"></i>Joined ${new Date(prof.created_at).toLocaleDateString('en',{month:'long',year:'numeric'})}</span></div>
<div style="display:flex;gap:20px;margin-top:12px;font-size:14px;padding-bottom:12px"><span><strong style="color:#e7e9ea">${fwc||0}</strong> <span style="color:#71767b">Following</span></span><span><strong style="color:#e7e9ea">${fc||0}</strong> <span style="color:#71767b">Followers</span></span></div>
</div>
<div style="display:flex;border-bottom:1px solid #2f3336">
<div class="tab-i act">Posts</div>
<div class="tab-i" onclick="toast('Replies coming soon','info')">Replies</div>
<div class="tab-i" onclick="toast('Highlights coming soon','info')">Highlights</div>
<div class="tab-i" onclick="toast('Media coming soon','info')">Media</div>
<div class="tab-i" onclick="toast('Likes coming soon','info')">Likes</div>
</div>`;
}

/* ========== INLINE COMPOSE ========== */
function updInline(){
  const b=document.getElementById('inlineBtn'),t=document.getElementById('inlineCmp');if(!b||!t)return;
  const ok=t.value.trim().length>0;b.disabled=!ok;b.style.opacity=ok?'1':'.5';b.style.cursor=ok?'pointer':'default';
}
async function doInlinePost(){
  const t=document.getElementById('inlineCmp');if(!t)return;
  const c=t.value.trim();if(!c)return;
  const b=document.getElementById('inlineBtn');b.disabled=true;b.innerHTML='<div class="spin" style="margin:auto;border-top-color:#fff"></div>';
  await sb.from('posts').insert({user_id:me.id,content:c,like_count:0,repost_count:0,reply_count:0,bookmark_count:0});
  t.value='';updInline();toast('Post sent!','success');await loadFeed();
}

/* ========== REALTIME ========== */
function setupRealtime(){
  if(!sb)return;
  const ch=sb.channel('nm-realtime')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'posts'},payload=>{
      if(view==='home'&&payload.new&&payload.new.user_id!==me.id){
        const fc=document.getElementById('feedCont');if(!fc)return;
        if(!fc.querySelector('.new-bar')){
          const bar=document.createElement('div');
          bar.className='new-bar';
          bar.style.cssText='background:rgba(29,155,240,0.1);color:#1d9bf0;text-align:center;padding:10px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;border-bottom:1px solid #2f3336';
          bar.textContent='See new posts';
          bar.onclick=()=>{bar.remove();loadFeed()};
          bar.onmouseover=()=>bar.style.background='rgba(29,155,240,0.2)';
          bar.onmouseout=()=>bar.style.background='rgba(29,155,240,0.1)';
          fc.prepend(bar);
        }
      }
    }).subscribe();
}

/* ========== INIT ========== */
async function init(){
  if(!sb){render();return}
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(session){me=session.user;await loadMyProf();setupRealtime()}
  }catch(e){console.error('Session check failed',e)}
  render();
  try{
    sb.auth.onAuthStateChange(async(event,session)=>{
      if(event==='SIGNED_IN'&&session){me=session.user;await loadMyProf();setupRealtime();render()}
      else if(event==='SIGNED_OUT'){me=null;myProf=null;render()}
    });
  }catch(e){}
  // Close dropdowns on outside click
  document.addEventListener('click',e=>{
    document.querySelectorAll('.dd-menu').forEach(m=>{if(!m.parentElement.contains(e.target))m.style.display='none'});
  });
  document.getElementById('cmpModal').addEventListener('click',function(e){if(e.target===this)closeModal()});
}

init();
</script>
