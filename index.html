// ==================== ANTI-RECORDING ====================
(function initAntiRecording() {
  // Block screen capture via getDisplayMedia
  if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
    const original = navigator.mediaDevices.getDisplayMedia.bind(navigator.mediaDevices);
    navigator.mediaDevices.getDisplayMedia = function() {
      showRecordingWarning();
      return Promise.reject(new Error('Screen recording blocked'));
    };
  }
  // Block getUserMedia (audio recording)
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    const original = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
    navigator.mediaDevices.getUserMedia = function(constraints) {
      if (constraints && constraints.audio) {
        showRecordingWarning();
        return Promise.reject(new Error('Audio recording blocked'));
      }
      return original(constraints);
    };
  }
  // Detect screen capture change
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) return;
    detectScreenCapture();
  });
  // Periodic check
  setInterval(detectScreenCapture, 3000);
  // Block print screen
  document.addEventListener('keydown', function(e) {
    if (e.key === 'PrintScreen') {
      e.preventDefault();
      showRecordingWarning();
    }
    // Block common screenshot shortcuts
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === '3' || e.key === '4' || e.key === '5')) {
      e.preventDefault();
      showRecordingWarning();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
    }
  });
  // Block right-click context menu
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  // Block copy
  document.addEventListener('copy', function(e) { e.preventDefault(); });
  // Block drag
  document.addEventListener('dragstart', function(e) { e.preventDefault(); });
  // Detect Picture-in-Picture
  if (document.pictureInPictureElement !== undefined) {
    const pipObserver = new MutationObserver(function() {
      if (document.pictureInPictureElement) {
        document.exitPictureInPicture();
        showRecordingWarning();
      }
    });
  }
})();

async function detectScreenCapture() {
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    stream.getTracks().forEach(t => t.stop());
    // If we got here, screen is being shared
    showRecordingWarning();
  } catch(e) {
    // Normal - no screen capture
  }
}

let recordingWarningTimeout = null;
function showRecordingWarning() {
  document.body.classList.add('is-recording');
  const warn = document.getElementById('recordingWarning');
  warn.style.display = 'flex';
  clearTimeout(recordingWarningTimeout);
  recordingWarningTimeout = setTimeout(() => {
    document.body.classList.remove('is-recording');
    warn.style.display = 'none';
  }, 5000);
}

// ==================== TOAST ====================
function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.textContent = msg;
  container.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// ==================== AUTH ====================
async function signUp(email, password, username, displayName) {
  if (!username || !displayName || !email || !password) {
    showToast('All fields are required', 'error'); return;
  }
  if (username.length < 3) { showToast('Username must be at least 3 characters', 'error'); return; }
  if (password.length < 6) { showToast('Password must be at least 6 characters', 'error'); return; }

  // Check username availability
  const { data: existing } = await supabase.from('profiles').select('username').eq('username', username).single();
  if (existing) { showToast('Username already taken', 'error'); return; }

  const { data, error } = await supabase.auth.signUp({ email, password });
  if (error) { showToast(error.message, 'error'); return; }

  if (data.user) {
    const { error: profErr } = await supabase.from('profiles').insert({
      id: data.user.id, username, display_name: displayName, avatar_url: '', bio: '', banner_url: ''
    });
    if (profErr) { showToast(profErr.message, 'error'); return; }
    showToast('Account created! Please check your email to verify.', 'success');
    currentUser = data.user;
    await loadProfile();
    renderApp();
  }
}

async function signIn(email, password) {
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) { showToast(error.message, 'error'); return; }
  currentUser = data.user;
  await loadProfile();
  renderApp();
  showToast('Welcome back!', 'success');
}

async function signOut() {
  await supabase.auth.signOut();
  currentUser = null;
  myProfile = null;
  subscriptions.forEach(s => s.unsubscribe());
  subscriptions = [];
  renderApp();
}

  myProfile = data || { id: currentUser.id, username: 'user', display_name: 'User', bio: '', avatar_url: '', banner_url: '' };

async function loadHomeFeed() {
  const feed = document.getElementById('feedContainer');
  if (!feed) return;
  feed.innerHTML = '<div style="padding:40px;display:flex;justify-content:center;"><div class="spinner" style="width:32px;height:32px;"></div></div>';

  // Get following list
  const { data: follows } = await supabase.from('follows').select('following_id').eq('follower_id', currentUser.id);
  const followingIds = follows ? follows.map(f => f.following_id) : [];
  followingIds.push(currentUser.id);

  const { data: posts } = await supabase.from('posts')
    .select('*, profiles(username, display_name, avatar_url)')
    .in('user_id', followingIds)
    .is('reply_to', null)
    .order('created_at', { ascending: false })
    .limit(50);

  // Get likes
  const { data: myLikes } = await supabase.from('likes').select('post_id').eq('user_id', currentUser.id);
  const likedPostIds = new Set(myLikes ? myLikes.map(l => l.post_id) : []);

  const { data: myBookmarks } = await supabase.from('bookmarks').select('post_id').eq('user_id', currentUser.id);
  const bookmarkedIds = new Set(myBookmarks ? myBookmarks.map(b => b.post_id) : []);

  postsCache = posts || [];
  renderPosts(feed, postsCache, likedPostIds, bookmarkedIds);
}

// ==================== RENDER POSTS ====================
function renderPosts(container, posts, likedPostIds, bookmarkedIds) {
  if (posts.length === 0) {
    container.innerHTML = '<div style="padding:60px 20px;text-align:center;color:#71767b;"><i class="fas fa-feather" style="font-size:48px;margin-bottom:16px;display:block;"></i><p style="font-size:20px;font-weight:700;color:#e7e9ea;">No posts yet</p><p>When people post, you\'ll see their posts here.</p></div>';
    return;
  }
  container.innerHTML = posts.map(p => renderPostCard(p, likedPostIds, bookmarkedIds)).join('');
}

function renderPostCard(post, likedPostIds, bookmarkedIds, isDetailed = false, isReply = false) {
  const isLiked = likedPostIds.has(post.id);

    ${isReply ? '<div style="display:flex;justify-content:center;width:40px;flex-shrink:0;"><div style="width:2px;height:100%;background:#2f3336;border-radius:1px;min-height:24px;"></div></div>' : ''}

      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;justify-content:space-between;">

            <i class="fas fa-circle-check" style="color:#1d9bf0;font-size:14px;flex-shrink:0;display:${post.profiles?.username === 'verified' ? 'inline' : 'none'}"></i>
            <span style="color:#71767b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">@${post.profiles?.username || 'user'}</span>
            <span style="color:#71767b;">·</span>
            <span style="color:#71767b;white-space:nowrap;">${time}</span>
          </div>
          ${isDetailed ? `<div style="position:relative;"><button onclick="event.stopPropagation();togglePostMenu(this)" style="background:none;border:none;color:#71767b;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;" onmouseover="this.style.background='rgba(231,233,234,0.08)'" onmouseout="this.style.background='none'"><i class="fas fa-ellipsis"></i></button><div class="dropdown-menu" style="display:none;"><div class="dropdown-item" onclick="event.stopPropagation();deletePost('${post.id}')"><i class="fas fa-trash" style="color:#f4212e;"></i><span style="color:#f4212e;">Delete</span></div></div></div>` : ''}
        </div>
        <p style="font-size:${isDetailed ? '17px' : '15px'};line-height:${isDetailed ? '1.4' : '1.35'};margin-top:2px;word-wrap:break-word;">${linkifyContent(post.content)}</p>

            <div class="post-action bookmark ${isBookmarked ? 'active' : ''}" onclick="event.stopPropagation();toggleBookmark('${post.id}', this, ${isBookmarked})" style="color:${isBookmarked ? '#1d9bf0' : '#71767b'}">

function linkifyContent(text) {
  return text.replace(/@(\w+)/g, '<span style="color:#1d9bf0;cursor:pointer;">@$1</span>')
             .replace(/#(\w+)/g, '<span style="color:#1d9bf0;cursor:pointer;">#$1</span>')
             .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:#1d9bf0;text-decoration:none;">$1</a>')
             .replace(/\n/g, '<br>');
}

function formatTime(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return 'now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h';
  if (diff < 31536000) return d.toLocaleDateString('en', { month: 'short', day: 'numeric' });
  return d.toLocaleDateString('en', { month: 'short', day: 'numeric', year: 'numeric' });
}

// ==================== INTERACTIONS ====================
async function toggleLike(postId, el, wasLiked) {
  if (!currentUser) return;
  if (wasLiked) {
    await supabase.from('likes').delete().eq('user_id', currentUser.id).eq('post_id', postId);
    await supabase.rpc('decrement_like', { p_id: postId }).catch(() => {
      // Fallback if no RPC
      supabase.from('posts').update({ like_count: Math.max(0, (parseInt(el.querySelector('span').textContent) || 1) - 1) }).eq('id', postId);
    });
    el.classList.remove('active');
    el.querySelector('i').className = 'far fa-heart';
    el.querySelector('span').textContent = Math.max(0, parseInt(el.querySelector('span').textContent) - 1);
    el.style.color = '#71767b';
  } else {
    await supabase.from('likes').insert({ user_id: currentUser.id, post_id: postId });
    await supabase.rpc('increment_like', { p_id: postId }).catch(() => {
      supabase.from('posts').update({ like_count: (parseInt(el.querySelector('span').textContent) || 0) + 1 }).eq('id', postId);
    });
    el.classList.add('active');
    el.querySelector('i').className = 'fas fa-heart';
    el.querySelector('i').classList.add('heart-pop');
    el.querySelector('span').textContent = parseInt(el.querySelector('span').textContent) + 1;
    el.style.color = '#f4212e';
  }
}

async function toggleRepost(postId, el) {
  if (!currentUser) return;
  const count = parseInt(el.querySelector('span').textContent);
  await supabase.from('posts').update({ repost_count: count + 1 }).eq('id', postId);
  el.classList.add('active');
  el.querySelector('span').textContent = count + 1;
  el.style.color = '#00ba7c';
  showToast('Reposted', 'success');
}

async function toggleBookmark(postId, el, wasBookmarked) {
  if (!currentUser) return;
  if (wasBookmarked) {
    await supabase.from('bookmarks').delete().eq('user_id', currentUser.id).eq('post_id', postId);
    el.classList.remove('active');
    el.querySelector('i').className = 'far fa-bookmark';
    el.style.color = '#71767b';
  } else {
    await supabase.from('bookmarks').insert({ user_id: currentUser.id, post_id: postId });
    el.classList.add('active');
    el.querySelector('i').className = 'fas fa-bookmark';
    el.style.color = '#1d9bf0';
    showToast('Added to Bookmarks', 'success');
  }
}

async function deletePost(postId) {
  if (!currentUser) return;
  await supabase.from('likes').delete().eq('post_id', postId);
  await supabase.from('bookmarks').delete().eq('post_id', postId);
  await supabase.from('posts').delete().eq('id', postId);
  showToast('Post deleted', 'info');
  navigateToView(currentView);
}

function sharePost(postId) {
  const url = window.location.origin + '/post/' + postId;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => showToast('Link copied to clipboard', 'success'));
  } else {
    showToast('Link: ' + url, 'info');
  }
}

function openReply(postId, username) {
  openComposeModal();
  const textarea = document.getElementById('composeText');
  textarea.value = `@${username} `;
  textarea.focus();
  updateComposeBtn();

  // Override submit for reply
  const btn = document.getElementById('composePostBtn');
  btn.onclick = async function() {
    const content = textarea.value.trim();
    if (!content) return;
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="margin:auto;border-top-color:#fff;"></div>';
    const { error } = await supabase.from('posts').insert({
      user_id: currentUser.id, content, reply_to: postId, like_count: 0, repost_count: 0, reply_count: 0, bookmark_count: 0
    });
    if (!error) {
      await supabase.from('posts').update({ reply_count: Math.min((await supabase.from('posts').select('reply_count').eq('id', postId).single()).data?.reply_count || 0, 9999) + 1 }).eq('id', postId);
    }
    closeComposeModal();
    btn.onclick = submitPost;
    showToast('Reply sent!', 'success');
    if (viewingPostId) loadPostThread(viewingPostId);
  };
}

function togglePostMenu(btn) {
  const menu = btn.nextElementSibling;
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
}

  currentView = view;
  viewingPostId = null;
  viewingProfile = null;

}

  viewingPostId = postId;

}

        </div>` : ''}

      ${currentView === 'home' ? `
      <!-- Compose Area -->
      <div style="display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #2f3336;">
        <img src="${myProfile?.avatar_url || `https://picsum.photos/seed/${currentUser.id}/100/100.jpg`}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;" onerror="this.src='https://picsum.photos/seed/${currentUser.id}/100/100.jpg'">
        <div style="flex:1;display:flex;flex-direction:column;">

              <button style="color:#1d9bf0;background:none;border:none;cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;" onmouseover="this.style.background='rgba(29,155,240,0.15)'" onmouseout="this.style.background='none'"><i class="fas fa-image"></i></button>
              <button style="color:#1d9bf0;background:none;border:none;cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;" onmouseover="this.style.background='rgba(29,155,240,0.15)'" onmouseout="this.style.background='none'"><i class="fas fa-face-smile"></i></button>
            </div>
            <button id="inlinePostBtn" onclick="submitInlinePost()" style="background:#1d9bf0;color:#fff;border:none;padding:8px 20px;border-radius:9999px;font-weight:700;font-size:15px;cursor:pointer;opacity:0.5;" disabled>Post</button>
          </div>
        </div>
      </div>` : ''}

      <!-- Feed -->
      <div id="feedContainer" style="border-bottom:1px solid #2f3336;">
        <div style="padding:40px;display:flex;justify-content:center;"><div class="spinner" style="width:32px;height:32px;"></div></div>
      </div>
    </main>

    <!-- Right Sidebar -->
    <aside class="right-sidebar" style="width:350px;flex-shrink:0;padding:0 24px;position:sticky;top:0;height:100vh;overflow-y:auto;">
      <div style="padding:8px 0;">
        <div style="position:relative;margin-bottom:12px;">
          <i class="fas fa-magnifying-glass" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#71767b;font-size:14px;"></i>
          <input placeholder="Search X" style="width:100%;padding:10px 14px 10px 40px;background:#202327;border:1px solid #202327;border-radius:9999px;color:#e7e9ea;font-size:15px;outline:none;transition:all 0.2s;" onfocus="this.style.border='1px solid #1d9bf0';this.style.background='#000'" onblur="this.style.border='1px solid #202327';this.style.background='#202327'">
        </div>
        <!-- What's happening -->
        <div style="background:#16181c;border-radius:16px;margin-bottom:16px;overflow:hidden;">
          <h3 style="font-size:20px;font-weight:700;padding:12px 16px;">What's happening</h3>
          <div class="trend-item">
            <div style="font-size:13px;color:#71767b;">Technology · Trending</div>
            <div style="font-weight:700;font-size:15px;">#AI</div>
            <div style="font-size:13px;color:#71767b;">24.5K posts</div>
          </div>
          <div class="trend-item">
            <div style="font-size:13px;color:#71767b;">Business · Trending</div>
            <div style="font-weight:700;font-size:15px;">#CryptoMarket</div>
            <div style="font-size:13px;color:#71767b;">18.2K posts</div>
          </div>
          <div class="trend-item">
            <div style="font-size:13px;color:#71767b;">Entertainment · Trending</div>
            <div style="font-weight:700;font-size:15px;">#NewRelease</div>
            <div style="font-size:13px;color:#71767b;">9.1K posts</div>
          </div>
          <div class="trend-item">
            <div style="font-size:13px;color:#71767b;">Sports · Trending</div>
            <div style="font-weight:700;font-size:15px;">#ChampionsLeague</div>
            <div style="font-size:13px;color:#71767b;">42.8K posts</div>
          </div>
          <div class="trend-item" style="color:#1d9bf0;font-size:14px;">Show more</div>
        </div>
        <!-- Who to follow -->
        <div id="whoToFollow" style="background:#16181c;border-radius:16px;overflow:hidden;">
          <h3 style="font-size:20px;font-weight:700;padding:12px 16px;">Who to follow</h3>
          <div style="padding:12px 16px;"><div class="spinner" style="margin:auto;"></div></div>

    </aside>
  </div>

  <!-- Mobile Bottom Nav -->
  <nav class="mobile-nav" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #2f3336;padding:8px 0;z-index:100;justify-content:space-around;align-items:center;">
    <button onclick="navigateToView('home')" style="background:none;border:none;color:${currentView==='home'?'#1d9bf0':'#e7e9ea'};font-size:22px;padding:8px;cursor:pointer;"><i class="fas fa-house"></i></button>
    <button onclick="navigateToView('explore')" style="background:none;border:none;color:${currentView==='explore'?'#1d9bf0':'#e7e9ea'};font-size:22px;padding:8px;cursor:pointer;"><i class="fas fa-magnifying-glass"></i></button>
    <button onclick="openComposeModal()" style="background:none;border:none;color:#e7e9ea;font-size:22px;padding:8px;cursor:pointer;"><i class="fas fa-plus-circle"></i></button>
    <button onclick="navigateToProfile('${myProfile?.id || ''}')" style="background:none;border:none;color:${currentView==='profile'?'#1d9bf0':'#e7e9ea'};font-size:22px;padding:8px;cursor:pointer;"><i class="far fa-user"></i></button>

  // Load content based on view
  loadViewContent();
  loadWhoToFollow();

  // Compose text input
  const composeText = document.getElementById('composeText');
  if (composeText) {
    composeText.addEventListener('input', updateComposeBtn);
  }
  const inlineCompose = document.querySelector('.inline-compose');
  if (inlineCompose) {
    inlineCompose.addEventListener('input', updateInlineBtn);
  }

  // Profile view needs separate render
  if (isProfile) {

}

async function loadViewContent() {
  switch (currentView) {
    case 'home': await loadHomeFeed(); break;
    case 'explore': await loadExploreFeed(); break;
    case 'profile': await loadProfileFeed(viewingProfile); break;
    case 'thread': await loadPostThread(viewingPostId); break;
    case 'bookmarks': await loadBookmarksFeed(); break;
  }
}

async function loadBookmarksFeed() {
  const feed = document.getElementById('feedContainer');
  if (!feed) return;
  feed.innerHTML = '<div style="padding:40px;display:flex;justify-content:center;"><div class="spinner" style="width:32px;height:32px;"></div></div>';

  const { data: bm } = await supabase.from('bookmarks').select('post_id').eq('user_id', currentUser.id);
  const postIds = bm ? bm.map(b => b.post_id) : [];

  if (postIds.length === 0) {
    feed.innerHTML = '<div style="padding:60px 20px;text-align:center;color:#71767b;"><i class="far fa-bookmark" style="font-size:48px;margin-bottom:16px;display:block;"></i><p style="font-size:20px;font-weight:700;color:#e7e9ea;">No bookmarks yet</p><p>Save posts to read later.</p></div>';
    return;
  }

  const { data: posts } = await supabase.from('posts')
    .select('*, profiles(username, display_name, avatar_url)')
    .in('id', postIds)
    .order('created_at', { ascending: false });

  const { data: myLikes } = await supabase.from('likes').select('post_id').eq('user_id', currentUser.id);
  const likedPostIds = new Set(myLikes ? myLikes.map(l => l.post_id) : []);
  const bookmarkedIds = new Set(postIds);

  postsCache = posts || [];
  renderPosts(feed, postsCache, likedPostIds, bookmarkedIds);
}

async function loadWhoToFollow() {
  const container = document.getElementById('whoToFollow');
  if (!container) return;

  const { data: follows } = await supabase.from('follows').select('following_id').eq('follower_id', currentUser.id);
  const followingIds = follows ? follows.map(f => f.following_id) : [];
  followingIds.push(currentUser.id);

  const { data: profiles } = await supabase.from('profiles')
    .select('*')
    .not('id', 'in', `(${followingIds.join(',')})`)
    .limit(3);

  if (!profiles || profiles.length === 0) {
    container.innerHTML = '<h3 style="font-size:20px;font-weight:700;padding:12px 16px;">Who to follow</h3><p style="padding:16px;color:#71767b;font-size:14px;">No suggestions available</p>';
    return;
  }

  let html = '<h3 style="font-size:20px;font-weight:700;padding:12px 16px;">Who to follow</h3>';
  profiles.forEach(p => {
    const avatar = p.avatar_url || `https://picsum.photos/seed/${p.id}/100/100.jpg`;
    html += `
    <div style="display:flex;align-items:center;padding:12px 16px;gap:12px;cursor:pointer;transition:background 0.15s;" onmouseover="this.style.background='rgba(231,233,234,0.03)'" onmouseout="this.style.background='none'" onclick="navigateToProfile('${p.id}')">
      <img src="${avatar}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;" onerror="this.src='https://picsum.photos/seed/${p.id}/100/100.jpg'">
      <div style="flex:1;min-width:0;">
        <div style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${p.display_name}</div>
        <div style="color:#71767b;font-size:13px;">@${p.username}</div>
      </div>
      <button class="follow-btn not-following" onclick="event.stopPropagation();toggleFollow('${p.id}', this)">Follow</button>
    </div>`;
  });
  html += '<div class="trend-item" style="color:#1d9bf0;font-size:14px;">Show more</div>';
  container.innerHTML = html;
}

// ==================== PROFILE ====================
async function renderProfileHeader() {
  const main = document.querySelector('main');
  if (!main || !viewingProfile) return;

  const { data: profile } = await supabase.from('profiles').select('*').eq('id', viewingProfile).single();
  if (!profile) return;

  const { count: postCount } = await supabase.from('posts').select('*', { count: 'exact', head: true }).eq('user_id', viewingProfile).is('reply_to', null);
  const { count: followingCount } = await supabase.from('follows').select('*', { count: 'exact', head: true }).eq('follower_id', viewingProfile);
  const { count: followerCount } = await supabase.from('follows').select('*', { count: 'exact', head: true }).eq('following_id', viewingProfile);
  const { data: isFollowing } = await supabase.from('follows').select('*').eq('follower_id', currentUser.id).eq('following_id', viewingProfile).single();

  const avatar = profile.avatar_url || `https://picsum.photos/seed/${profile.id}/100/100.jpg`;
  const banner = profile.banner_url || '';
  const isOwnProfile = viewingProfile === currentUser.id;

  const headerHTML = `
  <header style="position:sticky;top:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(12px);z-index:100;border-bottom:1px solid #2f3336;">
    <div style="display:flex;align-items:center;padding:0 16px;">
      <button onclick="navigateToView('home')" style="background:none;border:none;color:#e7e9ea;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;" onmouseover="this.style.background='rgba(231,233,234,0.08)'" onmouseout="this.style.background='none'"><i class="fas fa-arrow-left" style="font-size:18px;"></i></button>
      <div style="margin-left:20px;">
        <h2 style="font-size:20px;font-weight:700;">${profile.display_name}</h2>
        <span style="color:#71767b;font-size:13px;">${postCount || 0} posts</span>
      </div>
    </div>
  </header>
  <!-- Banner -->
  <div class="profile-banner" style="${banner ? `background:url(${banner});background-size:cover;background-position:center;` : 'background:linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);'}">
  </div>
  <!-- Profile Info -->
  <div style="padding:0 16px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-top:-34px;">
      <img src="${avatar}" style="width:134px;height:134px;border-radius:50%;border:4px solid #000;object-fit:cover;" onerror="this.src='https://picsum.photos/seed/${profile.id}/100/100.jpg'">
      <div style="padding-top:12px;">
        ${isOwnProfile ?
          `<button onclick="showToast('Edit profile coming soon','info')" style="padding:8px 20px;border-radius:9999px;border:1px solid #536471;background:transparent;color:#e7e9ea;font-weight:700;font-size:14px;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.background='rgba(231,233,234,0.08)'" onmouseout="this.style.background='transparent'">Edit profile</button>` :
          (isFollowing ?
            `<button class="follow-btn following" onclick="toggleFollow('${profile.id}', this)">Following</button>` :
            `<button class="follow-btn not-following" onclick="toggleFollow('${profile.id}', this)">Follow</button>`
          )
        }
      </div>
    </div>
    <div style="margin-top:12px;">
      <h2 style="font-size:20px;font-weight:800;">${profile.display_name}</h2>
      <span style="color:#71767b;font-size:15px;">@${profile.username}</span>
    </div>
    ${profile.bio ? `<p style="margin-top:12px;font-size:15px;line-height:1.4;">${profile.bio}</p>` : ''}
    <div style="display:flex;gap:16px;margin-top:12px;color:#71767b;font-size:14px;">
      <span><i class="far fa-calendar" style="margin-right:4px;"></i>Joined ${new Date(profile.created_at).toLocaleDateString('en', {month:'long', year:'numeric'})}</span>
    </div>
    <div style="display:flex;gap:20px;margin-top:12px;font-size:14px;padding-bottom:12px;">
      <span><strong style="color:#e7e9ea;">${followingCount || 0}</strong> <span style="color:#71767b;">Following</span></span>
      <span><strong style="color:#e7e9ea;">${followerCount || 0}</strong> <span style="color:#71767b;">Followers</span></span>
    </div>
  </div>
  <!-- Tabs -->
  <div style="display:flex;border-bottom:1px solid #2f3336;">
    <div class="tab-item active">Posts</div>
    <div class="tab-item" onclick="showToast('Replies coming soon','info')">Replies</div>
    <div class="tab-item" onclick="showToast('Highlights coming soon','info')">Highlights</div>
    <div class="tab-item" onclick="showToast('Media coming soon','info')">Media</div>
    <div class="tab-item" onclick="showToast('Likes coming soon','info')">Likes</div>
  </div>`;

  main.innerHTML = headerHTML + '<div id="feedContainer"><div style="padding:40px;display:flex;justify-content:center;"><div class="spinner" style="width:32px;height:32px;"></div></div></div>';
  await loadProfileFeed(viewingProfile);
}

// ==================== FOLLOW ====================
async function toggleFollow(userId, btn) {
  if (!currentUser || userId === currentUser.id) return;

  const { data: isFollowing } = await supabase.from('follows')
    .select('*').eq('follower_id', currentUser.id).eq('following_id', userId).single();

  if (isFollowing) {
    await supabase.from('follows').delete().eq('follower_id', currentUser.id).eq('following_id', userId);
    btn.className = 'follow-btn not-following';
    btn.textContent = 'Follow';
  } else {
    await supabase.from('follows').insert({ follower_id: currentUser.id, following_id: userId });
    btn.className = 'follow-btn following';
    btn.textContent = 'Following';
  }
  loadWhoToFollow();
}

function toggleAccountMenu(el) {
  const menu = el.querySelector('.dropdown-menu');
  if (menu) menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
}

// ==================== INLINE COMPOSE ====================
function updateInlineBtn() {
  const btn = document.getElementById('inlinePostBtn');
  const textarea = document.querySelector('.inline-compose');
  if (!btn || !textarea) return;
  const hasText = textarea.value.trim().length > 0;
  btn.disabled = !hasText;
  btn.style.opacity = hasText ? '1' : '0.5';
  btn.style.cursor = hasText ? 'pointer' : 'default';
}

async function submitInlinePost() {
  const textarea = document.querySelector('.inline-compose');
  if (!textarea) return;
  const content = textarea.value.trim();
  if (!content) return;
  const btn = document.getElementById('inlinePostBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner" style="margin:auto;border-top-color:#fff;"></div>';

  await supabase.from('posts').insert({
    user_id: currentUser.id, content, like_count: 0, repost_count: 0, reply_count: 0, bookmark_count: 0
  });
  textarea.value = '';
  updateInlineBtn();
  showToast('Post sent!', 'success');
  await loadHomeFeed();
}

// ==================== REALTIME ====================
function setupRealtime() {
  subscriptions.forEach(s => s.unsubscribe());
  subscriptions = [];

  const sub = supabase
    .channel('public:posts')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, (payload) => {
      if (currentView === 'home') {
        // Optionally refresh or prepend post
        const feed = document.getElementById('feedContainer');
        if (feed && payload.new && payload.new.user_id !== currentUser.id) {
          // Show subtle indicator
          const existing = feed.querySelector('.new-posts-bar');
          if (!existing) {
            const bar = document.createElement('div');
            bar.className = 'new-posts-bar';
            bar.style.cssText = 'background:rgba(29,155,240,0.1);color:#1d9bf0;text-align:center;padding:10px;font-size:14px;font-weight:600;cursor:pointer;transition:background 0.15s;border-bottom:1px solid #2f3336;';
            bar.textContent = 'See new posts';
            bar.onclick = () => { bar.remove(); loadHomeFeed(); };
            bar.onmouseover = () => bar.style.background = 'rgba(29,155,240,0.2)';
            bar.onmouseout = () => bar.style.background = 'rgba(29,155,240,0.1)';
            feed.prepend(bar);
          }
        }
      }
    })
    .subscribe();
  subscriptions.push(sub);
}

// ==================== INIT ====================
async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    currentUser = session.user;
    await loadProfile();
    setupRealtime();
    renderApp();
  } else {
    renderApp();
  }

  // Listen for auth changes
  supabase.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session) {
      currentUser = session.user;
      await loadProfile();
      setupRealtime();
      renderApp();
    } else if (event === 'SIGNED_OUT') {
      currentUser = null;
      myProfile = null;
      subscriptions.forEach(s => s.unsubscribe());
      renderApp();
    }
  });

  // Close dropdowns on outside click
  document.addEventListener('click', function(e) {
    document.querySelectorAll('.dropdown-menu').forEach(m => {
      if (!m.parentElement.contains(e.target)) m.style.display = 'none';
    });
  });

  // Compose modal close on overlay click
  document.getElementById('composeModal').addEventListener('click', function(e) {
    if (e.target === this) closeComposeModal();
  });
}

init();
</script>
