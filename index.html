<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nafiz Meet</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config={theme:{extend:{colors:{xbg:'#000',xbg2:'#16181c',xborder:'#2f3336',xtext:'#e7e9ea',xtext2:'#71767b',xblue:'#1d9bf0',xred:'#f4212e',xgreen:'#00ba7c'},fontFamily:{sans:['"Noto Sans"','sans-serif']}}}}
</script>
<style>
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#2f3336 transparent}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#2f3336;border-radius:4px}
body{background:#000;color:#e7e9ea;font-family:'Noto Sans',sans-serif;margin:0;overflow-x:hidden}
::selection{background:rgba(29,155,240,0.4)}
input,textarea{font-family:inherit}
a{text-decoration:none;color:inherit}

body.is-recording #mainApp{filter:blur(30px);pointer-events:none;transition:filter 0.3s}
.recording-warning{display:none;position:fixed;inset:0;z-index:999999;background:rgba(0,0,0,0.97);align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#f4212e;font-size:28px;font-weight:700;text-align:center}
body.is-recording .recording-warning{display:flex}
.recording-warning i{font-size:72px}.recording-warning p{color:#e7e9ea;font-size:16px;font-weight:400;max-width:420px}

.toast-box{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:1000000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;color:#fff;transform:translateY(-30px);opacity:0;transition:all .3s;pointer-events:auto;white-space:nowrap}
.toast.show{transform:translateY(0);opacity:1}
.toast-error{background:#f4212e}.toast-success{background:#00ba7c}.toast-info{background:#1d9bf0}

.sb-item{display:flex;align-items:center;gap:20px;padding:12px 16px;border-radius:9999px;transition:background .2s;cursor:pointer;font-size:20px;user-select:none}
.sb-item:hover{background:rgba(231,233,234,0.08)}.sb-item.act{font-weight:700}
.sb-item i{width:26px;text-align:center;font-size:24px}

.post-card{border-bottom:1px solid #2f3336;padding:12px 16px;transition:background .15s;cursor:pointer}
.post-card:hover{background:rgba(231,233,234,0.03)}
.pa{display:flex;align-items:center;gap:4px;color:#71767b;font-size:13px;transition:all .15s;cursor:pointer}
.pa .iw{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pa.reply:hover,.pa.reply:hover .iw{color:#1d9bf0}.pa.reply:hover .iw{background:rgba(29,155,240,0.15)}
.pa.rt:hover,.pa.rt:hover .iw{color:#00ba7c}.pa.rt:hover .iw{background:rgba(0,186,124,0.15)}
.pa.rt.on{color:#00ba7c}.pa.rt.on .iw{background:rgba(0,186,124,0.15)}
.pa.lk:hover,.pa.lk:hover .iw{color:#f4212e}.pa.lk:hover .iw{background:rgba(244,33,46,0.15)}
.pa.lk.on{color:#f4212e}.pa.lk.on .iw{background:rgba(244,33,46,0.15)}
.pa.bm:hover,.pa.bm:hover .iw{color:#1d9bf0}.pa.bm:hover .iw{background:rgba(29,155,240,0.15)}
.pa.bm.on{color:#1d9bf0}.pa.bm.on .iw{background:rgba(29,155,240,0.15)}
.pa.sh:hover,.pa.sh:hover .iw{color:#1d9bf0}.pa.sh:hover .iw{background:rgba(29,155,240,0.15)}

.cmp-input{background:0 0;border:none;outline:none;color:#e7e9ea;font-size:20px;width:100%;resize:none;min-height:52px}
.cmp-input::placeholder{color:#71767b}

.modal-ov{position:fixed;inset:0;background:rgba(91,112,131,0.4);z-index:10000;display:none;align-items:center;justify-content:center}
.modal-ov.show{display:flex}
.modal-box{background:#000;border:1px solid #2f3336;border-radius:16px;width:600px;max-width:95vw;max-height:90vh;overflow-y:auto}

.auth-input{width:100%;padding:16px 12px;background:0 0;border:1px solid #333;border-radius:4px;color:#e7e9ea;font-size:17px;outline:none;transition:border .2s}
.auth-input:focus{border-color:#1d9bf0}

.tab-i{flex:1;text-align:center;padding:16px 0;color:#71767b;font-weight:500;cursor:pointer;position:relative;transition:all .2s}
.tab-i:hover{background:rgba(231,233,234,0.08)}.tab-i.act{color:#e7e9ea;font-weight:700}
.tab-i.act::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:56px;height:4px;background:#1d9bf0;border-radius:2px}

.tr-item{padding:12px 16px;transition:background .15s;cursor:pointer}.tr-item:hover{background:rgba(231,233,234,0.03)}

.fl-btn{padding:8px 20px;border-radius:9999px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;border:none}
.fl-btn.nf{background:#e7e9ea;color:#0f1419}.fl-btn.nf:hover{background:#d6d9db}
.fl-btn.fg{background:0 0;color:#e7e9ea;border:1px solid #536471}.fl-btn.fg:hover{border-color:#f4212e;color:#f4212e;background:rgba(244,33,46,0.1)}

.dd-menu{position:absolute;right:0;top:100%;background:#16181c;border:1px solid #2f3336;border-radius:12px;overflow:hidden;min-width:200px;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,0.5);display:none}
.dd-item{padding:12px 16px;cursor:pointer;transition:background .15s;font-size:15px;display:flex;align-items:center;gap:12px}
.dd-item:hover{background:rgba(231,233,234,0.08)}

.spin{width:20px;height:20px;border:2px solid #2f3336;border-top-color:#1d9bf0;border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes heartPop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}.hpop{animation:heartPop .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.fup{animation:fadeUp .3s ease forwards}
@keyframes pulse{0%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:0.8}100%{transform:scale(1);opacity:1}}.pulse-anim{animation:pulse 1.5s infinite}

.copyright-bar{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #2f3336;padding:8px 16px;text-align:center;font-size:12px;color:#71767b;z-index:9000;display:flex;align-items:center;justify-content:center;gap:8px}
.copyright-bar a{color:#1d9bf0;transition:color .2s}.copyright-bar a:hover{color:#1a8cd8}

.chat-list-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;transition:background .15s;border-bottom:1px solid #2f3336}
.chat-list-item:hover{background:rgba(231,233,234,0.03)}.chat-list-item.active{background:rgba(29,155,240,0.1)}
.msg-bubble{max-width:70%;padding:8px 12px;border-radius:16px;font-size:15px;line-height:1.35;word-wrap:break-word;position:relative}
.msg-sent{background:#1d9bf0;color:#fff;border-bottom-right-radius:4px;margin-left:auto}
.msg-recv{background:#2f3336;color:#e7e9ea;border-bottom-left-radius:4px}
.msg-input-bar{display:flex;gap:8px;padding:12px;border-top:1px solid #2f3336;background:#000}
.msg-input{flex:1;background:#202327;border:none;border-radius:9999px;padding:10px 16px;color:#e7e9ea;font-size:15px;outline:none}

.call-overlay{position:fixed;inset:0;z-index:50000;background:linear-gradient(135deg,#0f172a 0%,#000 100%);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.call-avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #1d9bf0;box-shadow:0 0 40px rgba(29,155,240,0.3)}

@media(max-width:1000px){.r-sb{display:none!important}}
@media(max-width:700px){.l-sb{display:none!important}.mob-nav{display:flex!important}}
</style>
</head>
<body>

<div class="recording-warning" id="recWarn"><i class="fas fa-shield-halved"></i><span>Recording Blocked</span><p>Screen recording and voice recording are strictly prohibited on Nafiz Meet for security purposes.</p></div>
<div class="toast-box" id="toastBox"></div>
<div id="mainApp"></div>

<div class="modal-ov" id="cmpModal">
<div class="modal-box" style="padding:0">
<div style="display:flex;align-items:center;padding:12px 16px"><button onclick="closeModal()" style="background:none;border:none;color:#e7e9ea;font-size:20px;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center" onmouseover="this.style.background='rgba(231,233,234,0.08)'" onmouseout="this.style.background='none'"><i class="fas fa-xmark"></i></button></div>
<div style="padding:0 16px 16px;display:flex;gap:12px">
<img id="cmpAvatar" src="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0">
<div style="flex:1"><textarea id="cmpText" class="cmp-input" placeholder="What is happening?!" rows="4" oninput="updCmpBtn()"></textarea>
<div style="border-top:1px solid #2f3336;padding-top:12px;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;gap:2px"><button style="color:#1d9bf0;background:none;border:none;cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center" onmouseover="this.style.background='rgba(29,155,240,0.15)'" onmouseout="this.style.background='none'"><i class="fas fa-image"></i></button></div>
<button id="cmpBtn" onclick="doPost()" style="background:#1d9bf0;color:#fff;border:none;padding:8px 24px;border-radius:9999px;font-weight:700;font-size:15px;cursor:pointer;opacity:.5" disabled>Post</button>
</div></div></div>
</div>
</div>

<div class="modal-ov" id="grpModal">
<div class="modal-box" style="padding:24px">
<h2 style="font-size:20px;font-weight:700;margin-bottom:16px">Create New Group</h2>
<input id="grpName" class="auth-input" placeholder="Group Name" style="margin-bottom:16px">
<p style="font-size:14px;color:#71767b;margin-bottom:8px">Select Members:</p>
<div id="grpMembersList" style="max-height:200px;overflow-y:auto;margin-bottom:16px"></div>
<button onclick="createGroup()" style="width:100%;padding:12px;border-radius:9999px;border:none;font-size:17px;font-weight:700;cursor:pointer;background:#1d9bf0;color:#fff">Create Group</button>
</div>
</div>

<div class="call-overlay" id="callUI">
<img id="callAvatar" src="" class="call-avatar pulse-anim" onerror="this.src='https://picsum.photos/seed/call/100/100.jpg'">
<h2 id="callName" style="font-size:28px;font-weight:700">User</h2>
<p id="callStatus" style="color:#71767b;font-size:16px">Calling...</p>
<div style="display:flex;gap:32px;margin-top:40px">
<button onclick="endCall()" style="width:64px;height:64px;border-radius:50%;background:#f4212e;border:none;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(244,33,46,0.4)"><i class="fas fa-phone-slash"></i></button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://fqpchcdxqzkzkhxtekho.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxcGNoY2R4cXpremtoeHRla2hvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjI2MzIsImV4cCI6MjA5Mzc5ODYzMn0.ykp2L-sfGrYaUdSB4SXyt8OfIXUIQCkiT8cTRw7biJg';
let sb=null;
try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){console.error('Supabase init failed',e)}

let me=null,myProf=null,view='home',viewProf=null,viewPostId=null,replyOverride=null;
let likedSet=new Set(),bmSet=new Set();
let activeConvo=null,convos=[],msgs=[];

(function(){
  if(navigator.mediaDevices){
    if(navigator.mediaDevices.getDisplayMedia){navigator.mediaDevices.getDisplayMedia=function(){showRecWarn();return Promise.reject(new Error('Blocked'))}}
    if(navigator.mediaDevices.getUserMedia){
      const og=navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
      navigator.mediaDevices.getUserMedia=function(c){if(c&&c.audio){showRecWarn();return Promise.reject(new Error('Blocked'))}return og(c)}
    }
  }
  document.addEventListener('keydown',function(e){if(e.key==='PrintScreen'){e.preventDefault();showRecWarn()}if((e.ctrlKey||e.metaKey)&&e.shiftKey&&'345'.includes(e.key)){e.preventDefault();showRecWarn()}});
  document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('dragstart',e=>e.preventDefault());
})();
let recTimeout=null;
function showRecWarn(){document.body.classList.add('is-recording');clearTimeout(recTimeout);recTimeout=setTimeout(()=>document.body.classList.remove('is-recording'),5000)}

function toast(msg,type='info'){const c=document.getElementById('toastBox'),t=document.createElement('div');t.className='toast toast-'+type;t.textContent=msg;c.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},3000)}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function linkify(t){return esc(t).replace(/@(\w+)/g,'<span style="color:#1d9bf0;cursor:pointer">@$1</span>').replace(/#(\w+)/g,'<span style="color:#1d9bf0;cursor:pointer">#$1</span>').replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:#1d9bf0">$1</a>').replace(/\n/g,'<br>')}
function fmtTime(d){const dt=new Date(d),now=new Date(),diff=(now-dt)/1000;if(diff<60)return'now';if(diff<3600)return Math.floor(diff/60)+'m';if(diff<86400)return Math.floor(diff/3600)+'h';if(diff<31536000)return dt.toLocaleDateString('en',{month:'short',day:'numeric'});return dt.toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'})}
function v(id){const e=document.getElementById(id);return e?e.value.trim():''}
function emptyState(i,t,s){return `<div style="padding:60px 20px;text-align:center;color:#71767b"><i class="${i}" style="font-size:48px;margin-bottom:16px;display:block"></i><p style="font-size:20px;font-weight:700;color:#e7e9ea">${t}</p><p>${s}</p></div>`}

async function doSignUp(){const em=v('sEmail'),pw=v('sPass'),un=v('sUser'),dn=v('sDisp');if(!em||!pw||!un||!dn){toast('All fields required','error');return}if(un.length<3){toast('Username min 3 chars','error');return}if(pw.length<6){toast('Password min 6 chars','error');return}const{data:ex}=await sb.from('profiles').select('username').eq('username',un).maybeSingle();if(ex){toast('Username taken','error');return}const{data,error}=await sb.auth.signUp({email:em,password:pw});if(error){toast(error.message,'error');return}if(data.user){await sb.from('profiles').insert({id:data.user.id,username:un,display_name:dn,bio:'',avatar_url:'',banner_url:''});toast('Account created!','success');me=data.user;await loadMyProf();render()}}
async function doSignIn(){const em=v('lEmail'),pw=v('lPass');if(!em||!pw){toast('Fill all fields','error');return}const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error){toast(error.message,'error');return}me=data.user;await loadMyProf();render();toast('Welcome back!','success')}
async function doSignOut(){await sb.auth.signOut();me=null;myProf=null;render()}
async function loadMyProf(){if(!me)return;const{data}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();myProf=data||{id:me.id,username:'user',display_name:'User',bio:'',avatar_url:'',banner_url:''}}

function openModal(){document.getElementById('cmpModal').classList.add('show');document.getElementById('cmpAvatar').src=myProf?.avatar_url||'https://picsum.photos/seed/'+(myProf?.id||'x')+'/100/100.jpg';document.getElementById('cmpText').value='';replyOverride=null;updCmpBtn();setTimeout(()=>document.getElementById('cmpText').focus(),100)}
function closeModal(){document.getElementById('cmpModal').classList.remove('show');replyOverride=null}
function updCmpBtn(){const b=document.getElementById('cmpBtn'),t=document.getElementById('cmpText');if(!b||!t)return;const ok=t.value.trim().length>0;b.disabled=!ok;b.style.opacity=ok?'1':'.5';b.style.cursor=ok?'pointer':'default'}
async function doPost(){const txt=document.getElementById('cmpText').value.trim();if(!txt)return;const b=document.getElementById('cmpBtn');b.disabled=true;b.innerHTML='<div class="spin" style="margin:auto;border-top-color:#fff"></div>';const ins={user_id:me.id,content:txt,like_count:0,repost_count:0,reply_count:0,bookmark_count:0};if(replyOverride)ins.reply_to=replyOverride;const{error}=await sb.from('posts').insert(ins);if(error){toast(error.message,'error');b.disabled=false;b.textContent='Post';return}closeModal();toast(replyOverride?'Reply sent!':'Post sent!','success');if(replyOverride&&viewPostId){await loadThread(viewPostId)}else{await loadFeed()}}

async function getLikedAndBm(){if(!me)return;const[l,b]=await Promise.all([sb.from('likes').select('post_id').eq('user_id',me.id),sb.from('bookmarks').select('post_id').eq('user_id',me.id)]);likedSet=new Set((l.data||[]).map(x=>x.post_id));bmSet=new Set((b.data||[]).map(x=>x.post_id))}
async function loadFeed(){const fc=document.getElementById('feedCont');if(!fc)return;fc.innerHTML='<div style="padding:40px;display:flex;justify-content:center"><div class="spin" style="width:32px;height:32px"></div></div>';await getLikedAndBm();let posts=[];if(view==='home'){const{data:fw}=await sb.from('follows').select('following_id').eq('follower_id',me.id);const ids=fw?fw.map(f=>f.following_id):[];ids.push(me.id);const{data:p}=await sb.from('posts').select('*,profiles(username,display_name,avatar_url)').in('user_id',ids).is('reply_to',null).order('created_at',{ascending:false}).limit(50);posts=p||[]}else if(view==='explore'){const{data:p}=await sb.from('posts').select('*,profiles(username,display_name,avatar_url)').is('reply_to',null).order('like_count',{ascending:false}).limit(50);posts=p||[]}else if(view==='profile'&&viewProf){const{data:p}=await sb.from('posts').select('*,profiles(username,display_name,avatar_url)').eq('user_id',viewProf).is('reply_to',null).order('created_at',{ascending:false}).limit(50);posts=p||[]}else if(view==='bookmarks'){const{data:bm}=await sb.from('bookmarks').select('post_id').eq('user_id',me.id);const pids=(bm||[]).map(x=>x.post_id);if(pids.length===0){fc.innerHTML=emptyState('far fa-bookmark','No bookmarks yet','Save posts to read later.');return}const{data:p}=await sb.from('posts').select('*,profiles(username,display_name,avatar_url)').in('id',pids).order('created_at',{ascending:false});posts=p||[]}if(posts.length===0){fc.innerHTML=emptyState('fas fa-feather','No posts yet','When people post, you\'ll see them here.');return}fc.innerHTML=posts.map(p=>postHTML(p)).join('')}
async function loadThread(pid){const fc=document.getElementById('feedCont');if(!fc)return;fc.innerHTML='<div style="padding:40px;display:flex;justify-content:center"><div class="spin" style="width:32px;height:32px"></div></div>';await getLikedAndBm();const{data:post}=await sb.from('posts').select('*,profiles(username,display_name,avatar_url)').eq('id',pid).maybeSingle();const{data:reps}=await sb.from('posts').select('*,profiles(username,display_name,avatar_url)').eq('reply_to',pid).order('created_at',{ascending:true});let h='';if(post)h+=postHTML(post,true);if(reps&&reps.length)reps.forEach(r=>h+=postHTML(r,false,true));fc.innerHTML=h||emptyState('fas fa-feather','Post not found','')}

function postHTML(p,detail=false,isReply=false){const liked=likedSet.has(p.id),bmed=bmSet.has(p.id),av=p.profiles?.avatar_url||'https://picsum.photos/seed/'+p.user_id+'/100/100.jpg',tm=fmtTime(p.created_at);return `<article class="post-card fup" data-pid="${p.id}" ${!detail?`onclick="goPost('${p.id}')"`:''}><div style="display:flex;gap:12px"><div style="width:40px;flex-shrink:0">${isReply?'<div style="width:2px;height:100%;background:#2f3336;border-radius:1px;min-height:24px;margin:0 auto"></div>':''}</div><div style="margin-left:-40px;display:flex;gap:12px;flex:1;min-width:0"><img src="${av}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;cursor:pointer" onclick="event.stopPropagation();goProf('${p.user_id}')" onerror="this.src='https://picsum.photos/seed/${p.user_id}/100/100.jpg'"><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden"><span style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer" onclick="event.stopPropagation();goProf('${p.user_id}')">${esc(p.profiles?.display_name||'User')}</span><span style="color:#71767b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">@${esc(p.profiles?.username||'user')}</span><span style="color:#71767b">·</span><span style="color:#71767b;white-space:nowrap">${tm}</span></div>${detail&&p.user_id===me?.id?`<div style="position:relative"><button onclick="event.stopPropagation();this.nextElementSibling.style.display=this.nextElementSibling.style.display==='block'?'none':'block'" style="background:none;border:none;color:#71767b;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center"><i class="fas fa-ellipsis"></i></button><div class="dd-menu"><div class="dd-item" onclick="event.stopPropagation();delPost('${p.id}')"><i class="fas fa-trash" style="color:#f4212e"></i><span style="color:#f4212e">Delete</span></div></div></div>`:''}</div><p style="font-size:${detail?'17px':'15px'};line-height:1.35;margin-top:2px;word-wrap:break-word">${linkify(p.content)}</p><div style="display:flex;justify-content:space-between;margin-top:12px;max-width:425px;${detail?'':'opacity:.7'}"><div class="pa" onclick="event.stopPropagation();doReply('${p.id}','${p.profiles?.username||'user'}')"><div class="iw"><i class="far fa-comment" style="font-size:16px"></i></div><span>${p.reply_count||0}</span></div><div class="pa rt" onclick="event.stopPropagation();doRT('${p.id}',this)"><div class="iw"><i class="fas fa-retweet" style="font-size:16px"></i></div><span>${p.repost_count||0}</span></div><div class="pa lk ${liked?'on':''}" onclick="event.stopPropagation();doLike('${p.id}',this,${liked})"><div class="iw"><i class="${liked?'fas':'far'} fa-heart" style="font-size:16px"></i></div><span>${p.like_count||0}</span></div><div class="pa" style="cursor:default"><div class="iw"><i class="fas fa-chart-simple" style="font-size:16px"></i></div><span>${Math.floor(Math.random()*5000+100)}</span></div><div style="display:flex;gap:0"><div class="pa bm ${bmed?'on':''}" onclick="event.stopPropagation();doBm('${p.id}',this,${bmed})"><div class="iw"><i class="${bmed?'fas':'far'} fa-bookmark" style="font-size:16px"></i></div></div><div class="pa sh" onclick="event.stopPropagation();doShare('${p.id}')"><div class="iw"><i class="fas fa-arrow-up-from-bracket" style="font-size:16px"></i></div></div></div></div></div></div></div></article>`}

async function doLike(pid,el,was){if(!me)return;const sp=el.querySelector('span'),ic=el.querySelector('i');let c=parseInt(sp.textContent)||0;if(was){await sb.from('likes').delete().eq('user_id',me.id).eq('post_id',pid);await sb.from('posts').update({like_count:Math.max(0,c-1)}).eq('id',pid);el.classList.remove('on');ic.className='far fa-heart';sp.textContent=Math.max(0,c-1)}else{await sb.from('likes').insert({user_id:me.id,post_id:pid});await sb.from('posts').update({like_count:c+1}).eq('id',pid);el.classList.add('on');ic.className='fas fa-heart hpop';sp.textContent=c+1}}
async function doRT(pid,el){if(!me)return;const sp=el.querySelector('span');let c=parseInt(sp.textContent)||0;if(el.classList.contains('on'))return;await sb.from('posts').update({repost_count:c+1}).eq('id',pid);el.classList.add('on');sp.textContent=c+1;toast('Reposted','success')}
async function doBm(pid,el,was){if(!me)return;const ic=el.querySelector('i');if(was){await sb.from('bookmarks').delete().eq('user_id',me.id).eq('post_id',pid);el.classList.remove('on');ic.className='far fa-bookmark'}else{await sb.from('bookmarks').insert({user_id:me.id,post_id:pid});el.classList.add('on');ic.className='fas fa-bookmark';toast('Bookmarked','success')}}
function doShare(pid){const u=location.origin+'/post/'+pid;if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>toast('Link copied','success'));else toast(u,'info')}
async function delPost(pid){await sb.from('likes').delete().eq('post_id',pid);await sb.from('bookmarks').delete().eq('post_id',pid);await sb.from('posts').delete().eq('id',pid);toast('Post deleted','info');if(view==='home'||view==='explore')await loadFeed();else if(viewPostId)await loadThread(viewPostId);else render()}
function doReply(pid,uname){openModal();document.getElementById('cmpText').value='@'+uname+' ';replyOverride=pid;updCmpBtn()}
async function doFollow(uid,btn){if(!me||uid===me.id)return;const{data:existing}=await sb.from('follows').select('*').eq('follower_id',me.id).eq('following_id',uid).maybeSingle();if(existing){await sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',uid);btn.className='fl-btn nf';btn.textContent='Follow'}else{await sb.from('follows').insert({follower_id:me.id,following_id:uid});btn.className='fl-btn fg';btn.textContent='Following'}loadWTF()}

/* ===== MESSAGING ===== */
async function loadConvos(){
  const cl=document.getElementById('chatList');if(!cl)return;
  cl.innerHTML='<div style="padding:40px;display:flex;justify-content:center"><div class="spin" style="width:32px;height:32px"></div></div>';
  const{data:membs}=await sb.from('conversation_members').select('conversation_id').eq('user_id',me.id);
  if(!membs||!membs.length){cl.innerHTML=emptyState('far fa-comment-dots','No messages yet','Start a chat from a user profile.');return}
  const cids=membs.map(m=>m.conversation_id);
  const{data:cs}=await sb.from('conversations').select('*').in('id',cids).order('updated_at',{ascending:false});
  convos=cs||[];
  let h='';
  for(let c of convos){
    let name=c.name||'Chat',av='';
    if(!c.is_group){
      const{data:om}=await sb.from('conversation_members').select('user_id').eq('conversation_id',c.id).neq('user_id',me.id).limit(1).maybeSingle();
      if(om){const{data:op}=await sb.from('profiles').select('*').eq('id',om.user_id).maybeSingle();if(op){name=op.display_name;av=op.avatar_url||`https://picsum.photos/seed/${op.id}/100/100.jpg`}}
    }else{av='https://picsum.photos/seed/group'+c.id+'/100/100.jpg'}
    const{data:lm}=await sb.from('messages').select('content').eq('conversation_id',c.id).order('created_at',{ascending:false}).limit(1).maybeSingle();
    const lastMsg=lm?lm.content.substring(0,30)+(lm.content.length>30?'...':''):'No messages yet';
    h+=`<div class="chat-list-item ${activeConvo===c.id?'active':''}" onclick="openConvo('${c.id}')">
    <img src="${av}" style="width:50px;height:50px;border-radius:50%;object-fit:cover;flex-shrink:0" onerror="this.src='https://picsum.photos/seed/chat/100/100.jpg'">
    <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:16px;display:flex;justify-content:space-between"><span>${esc(name)}</span>${c.is_group?'<i class="fas fa-users" style="color:#71767b;font-size:12px"></i>':''}</div><div style="color:#71767b;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(lastMsg)}</div></div></div>`;
  }
  cl.innerHTML=h;
}

async function openConvo(cid){
  activeConvo=cid;
  document.getElementById('chatWindow').style.display='flex';
  document.getElementById('noChat').style.display='none';
  const{data:convo}=await sb.from('conversations').select('*').eq('id',cid).maybeSingle();
  let name=convo?.name||'Chat',av='';
  if(!convo?.is_group){
    const{data:om}=await sb.from('conversation_members').select('user_id').eq('conversation_id',cid).neq('user_id',me.id).maybeSingle();
    if(om){const{data:op}=await sb.from('profiles').select('*').eq('id',om.user_id).maybeSingle();if(op){name=op.display_name;av=op.avatar_url||`https://picsum.photos/seed/${op.id}/100/100.jpg`}}
  }else{av='https://picsum.photos/seed/group'+cid+'/100/100.jpg';name=convo?.name||'Group'}
  document.getElementById('chatHeader').innerHTML=`<div style="display:flex;align-items:center;gap:12px;flex:1"><img src="${av}" style="width:40px;height:40px;border-radius:50%;object-fit:cover" onerror="this.src='https://picsum.photos/seed/chat/100/100.jpg'"><div><div style="font-weight:700;font-size:16px">${esc(name)}</div><div style="color:#71767b;font-size:12px">${convo?.is_group?'Group':'Online'}</div></div></div><div style="display:flex;gap:8px"><button onclick="startCall('${esc(name)}','${av}')" style="background:none;border:none;color:#1d9bf0;font-size:18px;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center" onmouseover="this.style.background='rgba(29,155,240,0.15)'" onmouseout="this.style.background='none'"><i class="fas fa-phone"></i></button><button onclick="startCall('${esc(name)}','${av}')" style="background:none;border:none;color:#1d9bf0;font-size:18px;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center" onmouseover="this.style.background='rgba(29,155,240,0.15)'" onmouseout="this.style.background='none'"><i class="fas fa-video"></i></button></div>`;
  await loadMessages(cid);
  loadConvos();
}

async function loadMessages(cid){
  const mc=document.getElementById('msgCont');if(!mc)return;
  mc.innerHTML='<div style="padding:40px;display:flex;justify-content:center"><div class="spin" style="width:32px;height:32px"></div></div>';
  const{data:m}=await sb.from('messages').select('*, profiles(username, display_name, avatar_url)').eq('conversation_id',cid).order('created_at',{ascending:true}).limit(100);
  msgs=m||[];
  let h='',lastDate='';
  msgs.forEach(msg=>{
    const d=new Date(msg.created_at).toLocaleDateString();
    if(d!==lastDate){h+=`<div style="text-align:center;color:#71767b;font-size:12px;margin:12px 0">${d===new Date().toLocaleDateString()?'Today':d}</div>`;lastDate=d}
    const isMine=msg.sender_id===me.id;
    h+=`<div style="display:flex;justify-content:${isMine?'flex-end':'flex-start'};margin-bottom:4px;padding:0 12px">
    ${!isMine?`<img src="${msg.profiles?.avatar_url||'https://picsum.photos/seed/'+msg.sender_id+'/100/100.jpg'}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;margin-right:8px;align-self:flex-end" onerror="this.src='https://picsum.photos/seed/${msg.sender_id}/100/100.jpg'">`:''}
    <div><div class="msg-bubble ${isMine?'msg-sent':'msg-recv'}">${esc(msg.content)}</div><div style="font-size:10px;color:#71767b;margin-top:2px;text-align:${isMine?'right':'left'}">${new Date(msg.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div></div>`;
  });
  mc.innerHTML=h;
  mc.scrollTop=mc.scrollHeight;
}

async function sendMsg(){
  const inp=document.getElementById('msgInput');if(!inp)return;
  const txt=inp.value.trim();if(!txt||!activeConvo)return;
  await sb.from('messages').insert({conversation_id:activeConvo,sender_id:me.id,content:txt});
  await sb.from('conversations').update({updated_at:new Date().toISOString()}).eq('id',activeConvo);
  inp.value='';
  loadMessages(activeConvo);
  loadConvos();
}

async function startDM(userId){
  const{data:membs}=await sb.from('conversation_members').select('conversation_id').eq('user_id',me.id);
  let existingConvo=null;
  if(membs){
    for(let m of membs){
      const{data:other}=await sb.from('conversation_members').select('conversation_id').eq('conversation_id',m.conversation_id).eq('user_id',userId).maybeSingle();
      if(other){const{data:cd}=await sb.from('conversations').select('is_group').eq('id',other.conversation_id).maybeSingle();if(cd&&!cd.is_group){existingConvo=other.conversation_id;break}}
    }
  }
  if(existingConvo){goView('messages');setTimeout(()=>openConvo(existingConvo),300);return}
  const{data:c}=await sb.from('conversations').insert({is_group:false}).select().single();
  if(c){await sb.from('conversation_members').insert([{conversation_id:c.id,user_id:me.id},{conversation_id:c.id,user_id:userId}]);goView('messages');setTimeout(()=>openConvo(c.id),300)}
}

function openGrpModal(){document.getElementById('grpModal').classList.add('show');loadGrpMembers()}
async function loadGrpMembers(){const{data:pros}=await sb.from('profiles').select('*').neq('id',me.id);const c=document.getElementById('grpMembersList');if(!c||!pros)return;c.innerHTML=pros.map(p=>`<label style="display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer"><input type="checkbox" value="${p.id}" style="accent-color:#1d9bf0;width:18px;height:18px"><img src="${p.avatar_url||'https://picsum.photos/seed/'+p.id+'/100/100.jpg'}" style="width:36px;height:36px;border-radius:50%;object-fit:cover" onerror="this.src='https://picsum.photos/seed/${p.id}/100/100.jpg'"><span>${esc(p.display_name)} <span style="color:#71767b">@${esc(p.username)}</span></span></label>`).join('')}
async function createGroup(){const name=document.getElementById('grpName').value.trim();if(!name){toast('Group name required','error');return}const checks=document.querySelectorAll('#grpMembersList input:checked');const uids=Array.from(checks).map(c=>c.value);if(uids.length===0){toast('Select at least 1 member','error');return}const{data:c}=await sb.from('conversations').insert({is_group:true,name}).select().single();if(c){const inserts=[{conversation_id:c.id,user_id:me.id}];uids.forEach(uid=>inserts.push({conversation_id:c.id,user_id:uid}));await sb.from('conversation_members').insert(inserts);document.getElementById('grpModal').classList.remove('show');toast('Group created!','success');goView('messages');setTimeout(()=>openConvo(c.id),300)}}

let callTimer=null,callSec=0;
function startCall(name,av){
  document.getElementById('callUI').style.display='flex';
  document.getElementById('callAvatar').src=av||'https://picsum.photos/seed/call/100/100.jpg';
  document.getElementById('callName').textContent=name;
  document.getElementById('callStatus').textContent='Calling...';
  callSec=0;
  setTimeout(()=>{document.getElementById('callStatus').textContent='Connected (Simulated)';callTimer=setInterval(()=>{callSec++;const m=Math.floor(callSec/60),s=callSec%60;document.getElementById('callStatus').textContent=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;},1000)},2000);
}
function endCall(){document.getElementById('callUI').style.display='none';clearInterval(callTimer);toast(`Call ended - ${Math.floor(callSec/60)}m ${callSec%60}s`,'info')}

function goView(v){view=v;viewProf=null;viewPostId=null;activeConvo=null;render()}

async function loadWTF(){const c=document.getElementById('wtfBox');if(!c)return;const{data:fw}=await sb.from('follows').select('following_id').eq('follower_id',me.id);const ids=fw?fw.map(f=>f.following_id):[];ids.push(me.id);const{data:pros}=await sb.from('profiles').select('*').not('id','in',`(${ids.join(',')})`).limit(3);let h='<h3 style="font-size:20px;font-weight:700;padding:12px 16px">Who to follow</h3>';if(!pros||!pros.length){h+='<p style="padding:16px;color:#71767b;font-size:14px">No suggestions</p>';c.innerHTML=h;return}pros.forEach(p=>{const av=p.avatar_url||'https://picsum.photos/seed/'+p.id+'/100/100.jpg';h+=`<div style="display:flex;align-items:center;padding:12px 16px;gap:12px;cursor:pointer;transition:background .15s" onmouseover="this.style.background='rgba(231,233,234,0.03)'" onmouseout="this.style.background='none'" onclick="goProf('${p.id}')"><img src="${av}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0" onerror="this.src='https://picsum.photos/seed/${p.id}/100/100.jpg'"><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.display_name)}</div><div style="color:#71767b;font-size:13px">@${esc(p.username)}</div></div><button class="fl-btn nf" onclick="event.stopPropagation();doFollow('${p.id}',this)">Follow</button></div>`});c.innerHTML=h}

<div class="sb-item ${view==='messages'?'act':''}" onclick="goView('messages')"><i class="far fa-comment-dots"></i><span>Messages</span></div>
<div class="sb-item ${view==='calls'?'act':''}" onclick="goView('calls')"><i class="fas fa-phone"></i><span>Calls</span></div>
<div class="sb-item ${view==='bookmarks'?'act':''}" onclick="goView('bookmarks')"><i class="far fa-bookmark"></i><span>Bookmarks</span></div>
<div class="sb-item" onclick="goProf('${me?.id||''}')"><i class="far fa-user"></i><span>Profile</span></div>
<button onclick="openModal()" style="margin:16px 8px 0;padding:16px;border-radius:9999px;background:#1d9bf0;color:#fff;border:none;font-size:17px;font-weight:700;cursor:pointer;width:calc(100% - 16px)">Post</button>
</div>
<div style="padding:12px;margin-bottom:12px"><div style="display:flex;align-items:center;gap:12px;border-radius:9999px;cursor:pointer;padding:8px;position:relative" onclick="document.getElementById('acctDD').style.display=document.getElementById('acctDD').style.display==='block'?'none':'block'">
<img src="${myAv}" style="width:40px;height:40px;border-radius:50%;object-fit:cover" onerror="this.src='https://picsum.photos/seed/${me?.id||'x'}/100/100.jpg'">
<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(myProf?.display_name||'User')}</div><div style="color:#71767b;font-size:13px">@${esc(myProf?.username||'user')}</div></div>
<i class="fas fa-ellipsis" style="color:#e7e9ea;font-size:14px"></i>
<div id="acctDD" class="dd-menu" style="bottom:60px;left:0;top:auto;min-width:220px"><div class="dd-item" onclick="event.stopPropagation();doSignOut()"><i class="fas fa-right-from-bracket"></i>Sign out @${esc(myProf?.username||'user')}</div></div>
</div></div>
</nav>

<main style="flex:1;max-width:600px;border-left:1px solid #2f3336;border-right:1px solid #2f3336;min-height:100vh">
<div id="mainHeader"></div><div id="profileHeader"></div><div id="feedCont" style="border-bottom:1px solid #2f3336"></div>
</main>

<aside class="r-sb" style="width:350px;flex-shrink:0;padding:0 24px;position:sticky;top:0;height:100vh;overflow-y:auto">
<div style="padding:8px 0">
<div style="position:relative;margin-bottom:12px"><i class="fas fa-magnifying-glass" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#71767b;font-size:14px"></i><input placeholder="Search Nafiz Meet" style="width:100%;padding:10px 14px 10px 40px;background:#202327;border:1px solid #202327;border-radius:9999px;color:#e7e9ea;font-size:15px;outline:none" onfocus="this.style.border='1px solid #1d9bf0';this.style.background='#000'" onblur="this.style.border='1px solid #202327';this.style.background='#202327'"></div>
<div style="background:#16181c;border-radius:16px;margin-bottom:16px;overflow:hidden"><h3 style="font-size:20px;font-weight:700;padding:12px 16px">What's happening</h3><div class="tr-item"><div style="font-size:13px;color:#71767b">Technology · Trending</div><div style="font-weight:700">#AI</div></div><div class="tr-item"><div style="font-size:13px;color:#71767b">Business · Trending</div><div style="font-weight:700">#CryptoMarket</div></div><div class="tr-item" style="color:#1d9bf0;font-size:14px">Show more</div></div>
<div id="wtfBox" style="background:#16181c;border-radius:16px;overflow:hidden"><h3 style="font-size:20px;font-weight:700;padding:12px 16px">Who to follow</h3><div style="padding:12px 16px;display:flex;justify-content:center"><div class="spin"></div></div></div>
<div style="margin-top:16px;padding:0 16px;font-size:11px;color:#536471;line-height:1.6"><a href="https://mmjplaysyt.work.gd/" target="_blank" rel="noopener" style="color:#536471" onmouseover="this.style.color='#1d9bf0'" onmouseout="this.style.color='#536471'">Powered by MMJpages</a><br>&copy; ${new Date().getFullYear()} Nafiz Meet</div>
</div></aside>
</div>

<nav class="mob-nav" style="display:none;position:fixed;bottom:36px;left:0;right:0;background:#000;border-top:1px solid #2f3336;padding:8px 0;z-index:100;justify-content:space-around;align-items:center">
<button onclick="goView('home')" style="background:none;border:none;color:${view==='home'?'#1d9bf0':'#e7e9ea'};font-size:22px;padding:8px;cursor:pointer"><i class="fas fa-house"></i></button>
<button onclick="goView('messages')" style="background:none;border:none;color:${view==='messages'?'#1d9bf0':'#e7e9ea'};font-size:22px;padding:8px;cursor:pointer"><i class="fas fa-comment-dots"></i></button>
<button onclick="goView('calls')" style="background:none;border:none;color:${view==='calls'?'#1d9bf0':'#e7e9ea'};font-size:22px;padding:8px;cursor:pointer"><i class="fas fa-phone"></i></button>
<button onclick="openModal()" style="background:none;border:none;color:#e7e9ea;font-size:22px;padding:8px;cursor:pointer"><i class="fas fa-plus-circle"></i></button>
</nav>

<div class="copyright-bar"><span>&copy; ${new Date().getFullYear()} Nafiz Meet</span><span>·</span><span>Powered by <a href="https://mmjplaysyt.work.gd/" target="_blank">MMJpages</a></span></div>`;

  renderHeader();
  if(view==='profile')renderProfileHeader();
  if(view==='messages')renderMessagesUI();
  else if(view==='calls')renderCalls();
  else loadFeed();
  loadWTF();
}

function renderHeader(){
  const hdr=document.getElementById('mainHeader');if(!hdr)return;
  let h='';
  if(view==='home')h=`<header style="position:sticky;top:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(12px);z-index:100;border-bottom:1px solid #2f3336"><div style="display:flex;align-items:center;justify-content:space-between;padding:0 16px"><h2 style="font-size:20px;font-weight:700;padding:12px 0">Home</h2></div></header><div style="display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #2f3336"><img src="${myProf?.avatar_url||'https://picsum.photos/seed/'+(me?.id||'x')+'/100/100.jpg'}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0" onerror="this.src='https://picsum.photos/seed/${me?.id||'x'}/100/100.jpg'"><div style="flex:1;display:flex;flex-direction:column"><textarea class="cmp-input" id="inlineCmp" placeholder="What is happening?!" rows="2" oninput="updInline()"></textarea><div style="border-top:1px solid #2f3336;padding-top:12px;display:flex;align-items:center;justify-content:space-between"><div style="display:flex;gap:2px"><button style="color:#1d9bf0;background:none;border:none;cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center" onmouseover="this.style.background='rgba(29,155,240,0.15)'" onmouseout="this.style.background='none'"><i class="fas fa-image"></i></button></div><button id="inlineBtn" onclick="doInlinePost()" style="background:#1d9bf0;color:#fff;border:none;padding:8px 20px;border-radius:9999px;font-weight:700;font-size:15px;cursor:pointer;opacity:.5" disabled>Post</button></div></div></div>`;
  else if(view==='explore')h=`<header style="position:sticky;top:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(12px);z-index:100;border-bottom:1px solid #2f3336"><div style="padding:8px 16px"><h2 style="font-size:20px;font-weight:700;padding:8px 0">Explore</h2></div></header>`;
  else if(view==='bookmarks')h=`<header style="position:sticky;top:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(12px);z-index:100;border-bottom:1px solid #2f3336"><div style="padding:12px 16px"><h2 style="font-size:20px;font-weight:700">Bookmarks</h2></div></header>`;
  else if(view==='thread')h=`<header style="position:sticky;top:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(12px);z-index:100;border-bottom:1px solid #2f3336"><div style="display:flex;align-items:center;padding:0 16px"><button onclick="goView('home')" style="background:none;border:none;color:#e7e9ea;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center"><i class="fas fa-arrow-left"></i></button><h2 style="font-size:20px;font-weight:700;padding:12px 0;margin-left:16px">Post</h2></div></header>`;
  else if(view==='messages')h=`<header style="position:sticky;top:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(12px);z-index:100;border-bottom:1px solid #2f3336"><div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px"><h2 style="font-size:20px;font-weight:700">Messages</h2><button onclick="openGrpModal()" style="background:none;border:none;color:#1d9bf0;font-size:20px;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center" onmouseover="this.style.background='rgba(29,155,240,0.15)'" onmouseout="this.style.background='none'"><i class="fas fa-users"></i></button></div></header>`;
  else if(view==='calls')h=`<header style="position:sticky;top:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(12px);z-index:100;border-bottom:1px solid #2f3336"><div style="padding:12px 16px"><h2 style="font-size:20px;font-weight:700">Calls</h2></div></header>`;
  hdr.innerHTML=h;
}

function renderMessagesUI(){
  const fc=document.getElementById('feedCont');if(!fc)return;
  fc.innerHTML=`<div style="display:flex;height:calc(100vh - 65px)">
<div id="chatList" style="width:320px;border-right:1px solid #2f3336;overflow-y:auto;flex-shrink:0"></div>
<div style="flex:1;display:flex;flex-direction:column">
<div id="noChat" style="flex:1;display:flex;align-items:center;justify-content:center;color:#71767b;text-align:center;padding:20px"><div><i class="far fa-comment-dots" style="font-size:48px;margin-bottom:16px;display:block;color:#1d9bf0"></i><p style="font-size:20px;font-weight:700;color:#e7e9ea">Select a conversation</p><p>Choose from your existing chats or start a new one.</p></div></div>
<div id="chatWindow" style="display:none;flex-direction:column;height:100%">
<div id="chatHeader" style="padding:12px 16px;border-bottom:1px solid #2f3336;display:flex;align-items:center"></div>
<div id="msgCont" style="flex:1;overflow-y:auto;padding:12px 0"></div>
<div class="msg-input-bar"><input id="msgInput" class="msg-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()" style="background:#1d9bf0;color:#fff;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fas fa-paper-plane"></i></button></div>
</div>
</div>
</div>`;
  loadConvos();
}

function renderCalls(){const fc=document.getElementById('feedCont');if(!fc)return;fc.innerHTML=`<div style="padding:60px 20px;text-align:center;color:#71767b"><i class="fas fa-phone" style="font-size:48px;margin-bottom:16px;display:block;color:#1d9bf0"></i><p style="font-size:20px;font-weight:700;color:#e7e9ea">Nafiz Meet Calls</p><p style="margin-bottom:24px">Start a call from any chat conversation.</p><button onclick="goView('messages')" style="padding:12px 24px;border-radius:9999px;background:#1d9bf0;color:#fff;border:none;font-weight:700;cursor:pointer;font-size:15px">Go to Messages</button></div>`}

async function renderProfileHeader(){
  const c=document.getElementById('profileHeader');if(!c||!viewProf)return;
  const{data:prof}=await sb.from('profiles').select('*').eq('id',viewProf).maybeSingle();
  if(!prof){c.innerHTML='<p style="padding:40px;text-align:center;color:#71767b">Profile not found</p>';return}
  const{count:fc}=await sb.from('follows').select('*',{count:'exact',head:true}).eq('following_id',viewProf);
  const{count:fwc}=await sb.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',viewProf);
  const{data:isF}=await sb.from('follows').select('*').eq('follower_id',me.id).eq('following_id',viewProf).maybeSingle();
  const av=prof.avatar_url||'https://picsum.photos/seed/'+prof.id+'/100/100.jpg',own=viewProf===me.id;
  c.innerHTML=`<div style="height:200px;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)"></div><div style="padding:0 16px"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-top:-34px"><img src="${av}" style="width:134px;height:134px;border-radius:50%;border:4px solid #000;object-fit:cover" onerror="this.src='https://picsum.photos/seed/${prof.id}/100/100.jpg'"><div style="padding-top:12px;display:flex;gap:8px">${own?`<button onclick="toast('Edit profile coming soon','info')" style="padding:8px 20px;border-radius:9999px;border:1px solid #536471;background:transparent;color:#e7e9ea;font-weight:700;font-size:14px;cursor:pointer">Edit profile</button>`:`<button class="fl-btn ${isF?'fg':'nf'}" onclick="doFollow('${prof.id}',this)">${isF?'Following':'Follow'}</button><button onclick="startDM('${prof.id}')" style="padding:8px 20px;border-radius:9999px;border:1px solid #536471;background:transparent;color:#e7e9ea;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px"><i class="far fa-comment-dots"></i> Message</button>`}</div></div><div style="margin-top:12px"><h2 style="font-size:20px;font-weight:800">${esc(prof.display_name)}</h2><span style="color:#71767b">@${esc(prof.username)}</span></div>${prof.bio?`<p style="margin-top:12px;font-size:15px;line-height:1.4">${esc(prof.bio)}</p>`:''}<div style="display:flex;gap:20px;margin-top:12px;font-size:14px;padding-bottom:12px"><span><strong style="color:#e7e9ea">${fwc||0}</strong> <span style="color:#71767b">Following</span></span><span><strong style="color:#e7e9ea">${fc||0}</strong> <span style="color:#71767b">Followers</span></span></div></div><div style="display:flex;border-bottom:1px solid #2f3336"><div class="tab-i act">Posts</div><div class="tab-i" onclick="toast('Replies coming soon','info')">Replies</div><div class="tab-i" onclick="toast('Media coming soon','info')">Media</div></div>`;
}

function updInline(){const b=document.getElementById('inlineBtn'),t=document.getElementById('inlineCmp');if(!b||!t)return;const ok=t.value.trim().length>0;b.disabled=!ok;b.style.opacity=ok?'1':'.5';b.style.cursor=ok?'pointer':'default'}
async function doInlinePost(){const t=document.getElementById('inlineCmp');if(!t)return;const c=t.value.trim();if(!c)return;const b=document.getElementById('inlineBtn');b.disabled=true;b.innerHTML='<div class="spin" style="margin:auto;border-top-color:#fff"></div>';await sb.from('posts').insert({user_id:me.id,content:c,like_count:0,repost_count:0,reply_count:0,bookmark_count:0});t.value='';updInline();toast('Post sent!','success');await loadFeed()}

function setupRealtime(){if(!sb)return;sb.channel('nm-rt').on('postgres_changes',{event:'INSERT',schema:'public',table:'posts'},p=>{if(view==='home'&&p.new&&p.new.user_id!==me.id){const fc=document.getElementById('feedCont');if(fc&&!fc.querySelector('.new-bar')){const bar=document.createElement('div');bar.className='new-bar';bar.style.cssText='background:rgba(29,155,240,0.1);color:#1d9bf0;text-align:center;padding:10px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:1px solid #2f3336';bar.textContent='See new posts';bar.onclick=()=>{bar.remove();loadFeed()};fc.prepend(bar)}}}).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{if(p.new&&p.new.conversation_id===activeConvo){loadMessages(activeConvo)}}).subscribe()}

async function init(){if(!sb){render();return}try{const{data:{session}}=await sb.auth.getSession();if(session){me=session.user;await loadMyProf();setupRealtime()}}catch(e){}render();try{sb.auth.onAuthStateChange(async(e,s)=>{if(e==='SIGNED_IN'&&s){me=s.user;await loadMyProf();setupRealtime();render()}else if(e==='SIGNED_OUT'){me=null;myProf=null;render()}})}catch(e){}document.addEventListener('click',e=>{document.querySelectorAll('.dd-menu').forEach(m=>{if(!m.parentElement.contains(e.target))m.style.display='none'})});document.getElementById('cmpModal').addEventListener('click',function(e){if(e.target===this)closeModal()});document.getElementById('grpModal').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')})}
init();
</script>
</body>
</html>
